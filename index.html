<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>PS Plus</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b1f; --card:#12162f; --text:#fff; --muted:#8d93b9;
  --green:#52e5a3; --yellow:#ffd35c;
  --display:'Unbounded','Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}

/* ---------- Hero ---------- */
.hero{
  position:relative;overflow:hidden;padding:20px 20px 0;
  background:linear-gradient(180deg,#2b0d6e 0%,#5a1aa0 28%,#b92f9c 60%,#ff5f86 82%,#ff8f78 100%);
}
.hero-home{min-height:335px}
.hero-tier{min-height:300px}
.hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.pill{
  border:1.5px solid var(--yellow);color:var(--yellow);border-radius:999px;
  padding:6px 14px;font-weight:800;letter-spacing:.08em;font-size:13px;white-space:nowrap
}
.hero-sub{font-size:14px;font-weight:600;color:#f3e9ff}
.back{
  width:34px;height:34px;border-radius:50%;background:rgba(10,4,32,.45);
  color:#fff;font-size:22px;line-height:32px;text-align:center;flex:none
}
h1{
  font-family:var(--display);font-weight:800;font-size:31px;line-height:1.12;
  margin-top:18px;position:relative;z-index:2;max-width:78%
}
h1 em{font-style:normal;color:var(--yellow)}
.tier-title{font-size:44px;max-width:100%}
.tagline{
  position:relative;z-index:2;margin-top:10px;font-size:17px;font-weight:700;
  line-height:1.3;max-width:62%;color:#fff
}
.hero-art{position:absolute;left:0;bottom:0;width:100%;height:auto;display:block;pointer-events:none;z-index:1}

/* ---------- Home: tiers ---------- */
.tiers{padding:16px 16px 0;display:grid;gap:12px}
.tier{
  width:100%;background:var(--card);border-radius:20px;padding:16px 16px 14px 20px;
  box-shadow:inset 5px 0 0 var(--c);position:relative
}
.tier-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tier-name{font-family:var(--display);font-weight:800;font-size:22px;color:var(--c)}
.tier-desc{font-size:13px;color:var(--muted);margin-top:4px;font-weight:600}
.chev{font-size:26px;color:var(--muted);line-height:1}
.tier-prices{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;margin-top:14px}
.tp{display:flex;flex-direction:column;gap:3px;min-width:0}
.tp-l{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tp.best .tp-l{color:var(--green)}
.badge{background:var(--green);color:#06210f;border-radius:6px;padding:1px 5px;font-size:9px;font-weight:800;letter-spacing:.02em}
.tp-p{font-family:var(--display);font-weight:800;font-size:15px;white-space:nowrap}
.tp.best .tp-p{color:var(--c)}
.tp-s{font-size:11px;color:var(--green);font-weight:700}
.tp-s.base{color:var(--muted)}
.note{margin:14px 20px 0;font-size:12px;color:var(--muted);line-height:1.4}
.contact{
  display:block;margin:18px 16px 0;width:calc(100% - 32px);background:#ffd35c;color:#0a0b1f;
  border-radius:20px;padding:16px 18px;font-weight:800;font-size:15px
}
.contact small{display:block;font-size:12px;font-weight:700;opacity:.7;margin-top:3px}

/* ---------- Tier page ---------- */
.card{background:var(--card);border-radius:22px;padding:20px}
.features{list-style:none;display:grid;gap:14px;margin:16px 16px 0}
.features li{display:flex;gap:12px;align-items:center;font-size:15.5px;font-weight:600;line-height:1.3}
.features svg{flex:none;width:24px;height:24px}
.periods{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px;margin:14px 16px 0}
.period{
  background:var(--card);border:2px solid transparent;border-radius:18px;padding:14px 12px;min-width:0;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start
}
.period.sel{border-color:var(--c)}
.pl{font-size:12px;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.period.sel .pl{color:var(--c)}
.pp{font-family:var(--display);font-weight:800;font-size:18px;margin-top:6px;white-space:nowrap}
.period.sel .pp{color:var(--c)}
.ps{font-size:11px;font-weight:700;color:var(--green);margin-top:5px;line-height:1.3}
.ps.base{color:var(--muted)}
.why{
  margin:14px 16px 0;border:1.5px dashed var(--c);border-radius:20px;padding:16px;
  background:rgba(255,255,255,.02)
}
.why h4{color:var(--c);font-size:12px;letter-spacing:.07em;font-weight:800}
.why p{margin-top:8px;font-size:15px;line-height:1.45;font-weight:600}
.cta{
  position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));
  margin:16px 16px 0;width:calc(100% - 32px);border-radius:20px;padding:16px 18px;
  background:var(--c);color:#0a0b1f;display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5
}
.cta b{font-family:var(--display);font-weight:800;font-size:17px;display:block}
.cta small{font-size:12px;font-weight:800;opacity:.75;display:block;margin-top:5px}
.cta .go{font-weight:800;font-size:15px;white-space:nowrap}
.cta:active,.tier:active,.period:active,.contact:active{transform:scale(.985)}

/* ---------- Tab bar ---------- */
.tabbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;
  display:grid;grid-template-columns:repeat(4,1fr);background:rgba(14,16,40,.97);
  border-top:1px solid #232850;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30
}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative;text-align:center;padding:4px 0}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--yellow)}
.cnt{
  position:absolute;top:-3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;padding:0 5px;
  background:#ff5aa8;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center
}
.cnt[hidden]{display:none}
.hero-mini{padding-bottom:22px}
.hero-mini h1{max-width:100%;font-size:26px;margin-top:14px}
.fav{
  margin-left:auto;width:34px;height:34px;border-radius:50%;background:rgba(10,4,32,.45);
  display:flex;align-items:center;justify-content:center;flex:none
}
.fav svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fav.on svg{fill:#ff5aa8;stroke:#ff5aa8}

/* ---------- Cart / Profile ---------- */
.page{padding:16px 16px 0;display:grid;gap:12px}
.line{background:var(--card);border-radius:20px;padding:14px 14px 12px 18px;box-shadow:inset 5px 0 0 var(--c);display:grid;gap:10px}
.line-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.line-name{font-family:var(--display);font-weight:800;font-size:18px;color:var(--c)}
.line-sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:3px}
.line-price{font-family:var(--display);font-weight:800;font-size:15px;white-space:nowrap}
.line-bot{display:flex;justify-content:space-between;align-items:center}
.qty{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:14px;padding:4px}
.qty button{width:34px;height:34px;border-radius:10px;background:#1b2042;font-size:20px;font-weight:800;text-align:center}
.qty span{min-width:28px;text-align:center;font-weight:800}
.rm{font-size:13px;color:var(--muted);font-weight:700;padding:8px}
.sum{background:var(--card);border-radius:20px;padding:16px 18px;display:grid;gap:8px}
.sum-row{display:flex;justify-content:space-between;font-weight:700;font-size:14px;color:var(--muted)}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.sum-total b{font-family:var(--display);font-size:20px;color:var(--yellow)}
.link{display:block;margin:2px auto 0;color:var(--muted);font-size:13px;font-weight:700;padding:8px;text-align:center}
.empty{padding:40px 24px 10px;text-align:center;color:var(--muted);font-weight:600;line-height:1.45}
.empty b{display:block;color:var(--text);font-family:var(--display);font-size:18px;margin-bottom:8px}
.btn{
  display:block;margin:18px auto 0;background:var(--yellow);color:#0a0b1f;border-radius:16px;
  padding:14px 22px;font-weight:800;font-size:15px;text-align:center
}
.me{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:16px 18px}
.avatar{
  width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#ff5aa8,#b58cff);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px;flex:none
}
.me-name{font-weight:800;font-size:17px}
.me-sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.sec{font-weight:800;font-size:14px;color:var(--muted);margin:6px 4px 0}
.ord{background:var(--card);border-radius:18px;padding:14px 16px;display:grid;gap:6px;font-size:14px;font-weight:600}
.ord-h{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;font-weight:700}
.ord-t{font-weight:800;color:var(--yellow)}
.car{padding-top:14px}
.car-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car-track::-webkit-scrollbar{display:none}
.slide,.gcard{position:relative;display:block;overflow:hidden;text-align:left;color:#fff;background:linear-gradient(160deg,var(--b),var(--a))}
.slide{flex:0 0 90%;height:300px;border-radius:26px;scroll-snap-align:center}
.gcard{width:100%;aspect-ratio:3/4;border-radius:22px}
.slide-art{position:absolute;inset:0}
.slide-art svg{width:100%;height:100%;display:block}
.slide-txt,.gtxt{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(6,7,24,.92),rgba(6,7,24,0))}
.slide-txt{padding:48px 18px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.slide-tag{position:absolute;top:16px;left:18px;font-size:11.5px;font-weight:800;letter-spacing:.08em;background:rgba(6,7,24,.5);border-radius:999px;padding:6px 12px}
.slide h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05}
.slide small{display:block;margin-top:6px;font-size:16px;font-weight:800;color:var(--yellow)}
.slide-go{background:var(--yellow);color:#0a0b1f;font-weight:800;font-size:14px;padding:12px 16px;border-radius:14px;white-space:nowrap}
.dots{display:flex;justify-content:center;gap:6px;padding:12px 0 0}
.dot{width:8px;height:8px;border-radius:4px;background:#2b3160;transition:all .25s}
.dot.on{width:26px;background:var(--yellow)}
.sec-h{font-family:var(--display);font-weight:800;font-size:18px;margin:22px 20px 0}
.games{padding:12px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gw{position:relative}
.gw .fav{position:absolute;top:10px;right:10px}
.gtxt{padding:36px 14px 12px}
.gtitle{font-family:var(--display);font-weight:800;font-size:17px}
.gprice{margin-top:4px;font-size:14px;font-weight:800;color:var(--yellow)}
.tier-w{position:relative}
.tier-w .fav{position:absolute;top:12px;right:44px}
.tier-w .tier-head>div:first-child{padding-right:78px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 16px 0}
.lead-card{margin:16px 16px 0}
.chip{background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700}
.gal{margin:16px 16px 0;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 86%;aspect-ratio:16/9;object-fit:cover;border-radius:18px;scroll-snap-align:center;background:var(--card)}
.lead{line-height:1.5;font-weight:600;font-size:15px}
.hero-game{min-height:300px;background:linear-gradient(160deg,var(--b),var(--a))}
.hero-game .tier-title,.hero-game .tagline{position:relative;z-index:2}
.ck{background:var(--card);border-radius:20px;padding:16px 18px;display:grid;gap:10px}
.ck h3{font-size:15px;font-weight:800}
.ck-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;color:var(--muted)}
.ck-row span:last-child{color:var(--text);white-space:nowrap}
.ck-total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;border-top:1px solid #232850;padding-top:12px;margin-top:2px}
.ck-total b{font-family:var(--display);font-size:20px;color:var(--yellow)}
.chk{display:flex;gap:14px;align-items:center;width:100%;background:var(--card);border-radius:20px;padding:16px 18px;font-weight:700;font-size:15px;line-height:1.35}
.box{
  width:26px;height:26px;border-radius:8px;border:2px solid #4a5086;flex:none;
  display:flex;align-items:center;justify-content:center
}
.chk.on .box{background:var(--yellow);border-color:var(--yellow)}
.box svg{width:16px;height:16px;fill:none;stroke:#0a0b1f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on .box svg{opacity:1}
.field{display:grid;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field textarea{
  width:100%;background:var(--bg);color:var(--text);border:2px solid transparent;border-radius:14px;
  padding:14px;font:inherit;font-size:16px;font-weight:600;outline:none;resize:none
}
.field input:focus,.field textarea:focus{border-color:var(--yellow)}
.field input.bad{border-color:#ff5a6e}
.tiny{font-size:12px;color:var(--muted);line-height:1.4;margin:2px 6px 0}
#toast{
  position:fixed;left:50%;bottom:160px;transform:translate(-50%,20px);opacity:0;
  background:#222849;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:700;
  max-width:88%;text-align:center;transition:.25s;pointer-events:none;z-index:20
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.err{padding:60px 24px;text-align:center;color:var(--muted);font-weight:600}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px 0}
.tl{position:relative;display:block;width:100%;aspect-ratio:1/1;border-radius:24px;overflow:hidden;color:rgba(255,255,255,.92);text-align:left;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.tl .glow{position:absolute;left:50%;top:38%;width:78%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),rgba(255,255,255,0) 68%)}
.tl .ic{position:absolute;left:50%;top:38%;width:42%;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.tl .go{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:rgba(6,7,24,.38);display:grid;place-items:center;font-size:19px;line-height:1;color:#fff}
.tl .tx{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(6,7,24,.64);color:#fff;border-radius:16px;padding:9px 12px;display:grid;gap:2px}
.tl .tx b{font-weight:800;font-size:14px;line-height:1.2}
.tl .tx small{font-size:11.5px;font-weight:700;opacity:.72;line-height:1.2}
.tl:active{transform:scale(.985)}
.slide-txt{flex-wrap:wrap}
.slide-txt>div{min-width:0;flex:1 1 150px}
.slide-go{flex:none;margin-left:auto}
.car-up{position:relative;z-index:3;margin-top:-34px}
.wamt{position:relative}
.wamt input{width:100%;background:#0a0d22;border:2px solid transparent;border-radius:16px;padding:16px 46px 16px 18px;color:#fff;font:800 28px var(--display);outline:none}
.wamt input:focus{border-color:var(--yellow)}
.wamt input.bad{border-color:#ff5a6e}
.wamt i{position:absolute;right:18px;top:50%;transform:translateY(-50%);font:800 22px var(--display);font-style:normal;color:var(--muted)}
.wpre{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wp{background:#0a0d22;border-radius:14px;padding:14px 8px;font-weight:800;font-size:15px;color:#fff}
.wp.on{background:var(--yellow);color:#1a1300}
.how{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:20px;padding:16px 18px;font-weight:800;font-size:15px;color:#fff;text-align:left}
.how span{color:var(--yellow);font-size:20px;transition:transform .2s}
.how.on span{transform:rotate(90deg)}
.steps{background:var(--card);border-radius:20px;padding:6px 18px 14px;margin-top:-6px;counter-reset:s}
.steps li{list-style:none;counter-increment:s;display:flex;gap:12px;padding:10px 0;font-size:14px;line-height:1.4;font-weight:600}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--yellow);color:#1a1300;font-weight:800;font-size:13px;display:grid;place-items:center}
.rev{background:var(--card);border-radius:20px;padding:16px 18px;display:grid;gap:8px}
.rev b{font-size:14px}
.rev small{color:var(--muted);font-weight:700;font-size:12px}
.rev p{font-size:14px;line-height:1.45;font-weight:600}
.rev img{width:100%;border-radius:14px;display:block}
.rev-stars{display:flex;gap:6px;font-size:24px;cursor:pointer;user-select:none}
.rev-stars span{color:#3a3a5a;transition:color .15s}.rev-stars span.on{color:#ffd24d}
.rev-form{display:grid;gap:12px}.rev-form h3{font-size:16px;font-weight:800;margin:0}
.rev-sent{text-align:center;padding:16px 0;font-weight:700;color:var(--yellow)}

/* ===== LUMO redesign ===== */
:root{--display:'Manrope',system-ui,sans-serif;--card:#15163a;--edge:rgba(150,130,255,.2)}
h1,.sec-h,.tier-name,.line-name,.cta b,.avatar{letter-spacing:-.01em}
.hero{padding:14px 18px 0}
.hero-mini{padding-bottom:20px}
.hero-mini h1{margin-top:16px}
.card,.line,.sum,.ck,.chk,.how,.steps,.rev,.me,.ord,.menu{box-shadow:inset 0 0 0 1px var(--edge)}
.tabbar{left:12px;right:12px;transform:none;width:auto;max-width:456px;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom));
  border:1px solid rgba(150,130,255,.32);border-radius:26px;background:rgba(21,16,58,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:8px 6px}
.cta{bottom:calc(92px + env(safe-area-inset-bottom))}
.topbar{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;position:relative;z-index:3}
.topbar>:last-child{justify-self:end}
.topbar-home{grid-template-columns:1fr 40px;align-items:start}
.brand{text-align:center;line-height:1.1}
.topbar-home .brand{text-align:left}
.brand-sub{font-size:14px;font-weight:700;color:#fff;margin-top:3px}
.brand-tag{display:block;font-size:11px;letter-spacing:.22em;color:#cdb8ff;font-weight:700;margin-top:4px}
.circ{width:40px;height:40px;border-radius:50%;background:rgba(40,16,90,.55);display:grid;place-items:center;color:#fff;font-size:24px;line-height:1;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.circ svg{width:20px;height:20px;fill:currentColor}
.circ.stroke svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.topbar .fav{width:40px;height:40px;background:rgba(40,16,90,.55)}
.wm{display:inline-block;font-style:italic;font-weight:800;letter-spacing:.03em;color:#fff;transform:skewX(-6deg);text-shadow:0 2px 16px rgba(130,70,255,.55)}
.wm.s{font-size:23px}.wm.l{font-size:48px;letter-spacing:.05em}
.logo-img{display:block;height:30px;width:auto;margin:0 auto}
.logo-img.l{height:54px;margin:0}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".5" stop-color="#ffd35c"/><stop offset="1" stop-color="#e8a317"/></linearGradient>
    <linearGradient id="sunG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ff8f8f"/>
    </linearGradient>
    <symbol id="palm" viewBox="-12 -14 132 190">
      <g fill="#0a0420" stroke="#0a0420" stroke-linecap="round">
        <path d="M50 176 Q 44 100 52 42" fill="none" stroke-width="6"/>
        <path d="M52 42 Q 20 8 -8 36 Q 24 26 52 42 Z" stroke-width="1"/>
        <path d="M52 42 Q 22 32 2 68 Q 30 46 52 42 Z" stroke-width="1"/>
        <path d="M52 42 Q 84 8 112 36 Q 80 26 52 42 Z" stroke-width="1"/>
        <path d="M52 42 Q 82 32 102 68 Q 74 46 52 42 Z" stroke-width="1"/>
        <path d="M52 42 Q 44 14 60 -10 Q 58 22 52 42 Z" stroke-width="1"/>
      </g>
    </symbol>
  </defs>
</svg>

<div id="app"></div>
<div id="toast"></div>
<div id="sheet" hidden></div>
<nav class="tabbar" id="tabs" aria-label="Разделы">
  <button class="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg>Главная</button>
  <button class="tab" data-tab="fav"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></svg>Избранное</button>
  <button class="tab" data-tab="cart"><svg viewBox="0 0 24 24"><path d="M3 4h2.6l2.2 11h10.4l2-8H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>Корзина<b class="cnt" id="cartCnt" hidden>0</b></button>
  <button class="tab" data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c.8-4 3.7-5.8 7.5-5.8s6.7 1.8 7.5 5.8"/></svg>Профиль</button>
</nav>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const app = document.getElementById('app');
  const state = { view: 'home', tab: 'home', car: 0, tierId: null, periodId: null, ck: { ua: false, email: '', comment: '' }, w: { amount: 200, ua: false, email: '', comment: '', how: false }, rv: { stars: 5, text: '', sent: false } };
  const EMAIL_RE = /^[^@\s]{1,64}@[^@\s]{1,190}\.[^@\s]{2,20}$/;
  let catalog = null;
  let cart = [], favs = [], orders = [];
  const MAX_LINES = 6, MAX_QTY = 9;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ---------- helpers ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
  const money = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ' + catalog.currency;
  const tierPeriods = t => catalog.periods.filter(p => t.prices[p.id] != null);
  const saving = (t, p) => {
    const base = t.prices['1m'];
    if (!base || p.months === 1) return 0;
    return Math.round((1 - t.prices[p.id] / (base * p.months)) * 100);
  };
  const perMonth = (t, p) => Math.round(t.prices[p.id] / p.months);
  const bestPeriod = t => { const ps = tierPeriods(t); return ps[ps.length - 1]; };
  const rnd = seed => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
  const haptic = kind => { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} };

  function toast(text) {
    const el = document.getElementById('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove('show'), 3200);
  }

  /* ---------- illustration ---------- */
  function figure(x, y, c, pad, pony) {
    return `<g transform="translate(${x} ${y})" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="#0a0420">
      <rect x="-15" y="-36" width="11" height="40" rx="5.5"/>
      <rect x="4" y="-36" width="11" height="40" rx="5.5"/>
      ${pony ? '<path d="M11 -100 q 22 -6 15 22 q -3 -13 -13 -13 z"/>' : ''}
      <circle cx="0" cy="-92" r="15"/>
      <rect x="-24" y="-76" width="48" height="46" rx="15"/>
      <rect x="-13" y="-52" width="26" height="10" rx="5" fill="${pad}" stroke="none"/>
    </g>`;
  }

  function heroSvg(h, opt) {
    const W = 400, r = rnd(opt.seed || 7);
    const cols = ['#2fd4ff', '#ffd35c', '#ff5aa8'];
    let stars = '', bld = '', win = '', x = 0;
    for (let i = 0; i < 16; i++) {
      stars += `<circle cx="${Math.floor(r() * W)}" cy="${Math.floor(r() * h * 0.45)}" r="${(0.8 + r() * 0.8).toFixed(1)}" fill="#fff" opacity="${(0.4 + r() * 0.5).toFixed(2)}"/>`;
    }
    while (x < W) {
      const w = 26 + Math.floor(r() * 30);
      const centre = Math.abs(x + w / 2 - opt.sunX) / 200;
      const f = Math.min(1, 0.42 + centre * 0.9);
      const bh = Math.round((34 + r() * 50) * f);
      bld += `<rect x="${x}" y="${h - bh}" width="${w}" height="${bh}" fill="#150840"/>`;
      const n = 1 + Math.floor(r() * 3);
      for (let i = 0; i < n; i++) {
        win += `<rect x="${x + 4 + Math.floor(r() * (w - 12))}" y="${h - bh + 6 + Math.floor(r() * Math.max(1, bh - 16))}" width="4" height="4" fill="${cols[Math.floor(r() * 3)]}"/>`;
      }
      x += w;
    }
    const palms = (opt.palms || []).map(p =>
      `<use href="#palm" ${p.flip ? `transform="translate(${W} 0) scale(-1 1)"` : ''} x="${p.x}" y="${h - p.h + 6}" width="${Math.round(p.h * 0.7)}" height="${p.h}"/>`
    ).join('');
    const figs = (opt.figs || []).map(f => figure(f.x, h + 4, f.c, f.pad, f.pony)).join('');
    return `<svg class="hero-art" viewBox="0 0 ${W} ${h}" aria-hidden="true">
      ${stars}
      <circle cx="${opt.sunX}" cy="${h - 4}" r="${opt.sunR}" fill="url(#sunG)"/>
      ${bld}${win}${palms}${figs}
    </svg>`;
  }


  /* ---------- LUMO shared pieces ---------- */
  const brandName = () => catalog.brand || catalog.shop_name || 'LUMO';
  const logoHtml = size => catalog.logo
    ? `<img class="logo-img ${size}" src="${esc(catalog.logo)}" alt="${esc(brandName())}" data-logo="${size}">`
    : `<span class="wm ${size}">${esc(brandName())}</span>`;
  function fixLogos() {
    app.querySelectorAll('img[data-logo]').forEach(img => {
      const swap = () => { const s = document.createElement('span'); s.className = 'wm ' + img.dataset.logo; s.textContent = brandName(); img.replaceWith(s); };
      if (img.complete && img.naturalWidth === 0) swap(); else img.addEventListener('error', swap);
    });
  }
  const ICON = {
    dots: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
    gear: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>',
    heart: '<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></svg>',
    cart: '<svg viewBox="0 0 24 24"><path d="M3 4h2.6l2.2 11h10.4l2-8H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>',
    clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>',
    help: '<svg viewBox="0 0 24 24"><path d="M5 14v-2a7 7 0 0 1 14 0v2"/><rect x="3.5" y="13" width="3.5" height="6" rx="1.5"/><rect x="17" y="13" width="3.5" height="6" rx="1.5"/></svg>',
    info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.4"/></svg>',
    ctrl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h10a4 4 0 0 1 3.9 3.1l.9 4A2.6 2.6 0 0 1 19 18.3L16.8 16H7.2L5 18.3A2.6 2.6 0 0 1 2.2 15.1l.9-4A4 4 0 0 1 7 8Z"/><path d="M8 10.5v3M6.5 12h3"/><circle cx="15.5" cy="11.3" r=".7" fill="currentColor"/><circle cx="17.5" cy="12.8" r=".7" fill="currentColor"/></svg>',
    cal: '<svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="3"/><path d="M8 3.5v4M16 3.5v4M4 10h16"/></svg>',
    gift: '<svg viewBox="0 0 64 64"><rect x="8" y="26" width="48" height="32" rx="6" fill="url(#goldG)"/><rect x="5" y="18" width="54" height="12" rx="5" fill="url(#goldG)" stroke="#fff6c4" stroke-opacity=".5"/><rect x="28" y="18" width="8" height="40" fill="#ffb199" fill-opacity=".85"/><path d="M32 18c-10-14-22-6-14 0M32 18c10-14 22-6 14 0" fill="none" stroke="#ffe27a" stroke-width="4" stroke-linecap="round"/></svg>'
  };
  const plusSvg = cls => `<svg class="${cls || ''}" viewBox="0 0 64 64" aria-hidden="true"><path d="M24 6h16v18h18v16H40v18H24V40H6V24h18z" fill="url(#goldG)" stroke="#fff6c4" stroke-opacity=".7" stroke-width="1.6" stroke-linejoin="round"/><path d="M24 6h16v6H24z" fill="#fff" fill-opacity=".35"/></svg>`;
  const walletGold = cls => `<svg class="${cls || ''}" viewBox="0 0 96 88" aria-hidden="true"><rect x="6" y="18" width="84" height="62" rx="14" fill="url(#goldG)"/><rect x="6" y="18" width="84" height="16" rx="8" fill="#fff" fill-opacity=".28"/><rect x="52" y="40" width="42" height="26" rx="10" fill="#c98a0b"/><circle cx="66" cy="53" r="5" fill="#ffe9a0"/><circle cx="24" cy="12" r="7" fill="url(#goldG)" stroke="#fff6c4" stroke-opacity=".6"/></svg>`;
  const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return (m > 10 && m < 20) ? c : k === 1 ? a : (k > 1 && k < 5) ? b : c; };

  function topbar(sub, o = {}) {
    const more = `<button class="circ" data-menu aria-label="Меню">${ICON.dots}</button>`;
    if (o.home) {
      return `<div class="topbar topbar-home"><div class="brand">${logoHtml('l')}${catalog.brand_tag ? `<span class="brand-tag">${esc(catalog.brand_tag)}</span>` : ''}</div>${more}</div>`;
    }
    const left = o.noBack ? '<span></span>' : `<button class="circ" ${o.backAttr || 'data-back'} aria-label="Назад">‹</button>`;
    return `<div class="topbar">${left}<div class="brand">${logoHtml('s')}${sub ? `<div class="brand-sub">${esc(sub)}</div>` : ''}</div>${o.right || (o.noMore ? '<span></span>' : more)}</div>`;
  }

  function openMenu() {
    const s = document.getElementById('sheet');
    const q = catalog.contact
      ? `<button data-sgo="contact">${ICON.help.replace('<svg', '<svg width="24" height="24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"')}Написать менеджеру<small>@${esc(catalog.contact)}</small></button>` : '';
    s.innerHTML = `<div class="sheet-bg" data-close></div><div class="sheet-box">
      ${q}
      <button data-sgo="history">${ICON.clock.replace('<svg', '<svg width="24" height="24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"')}История заявок</button>
      <button data-sgo="about">${ICON.info.replace('<svg', '<svg width="24" height="24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"')}О магазине</button>
    </div>`;
    s.hidden = false;
  }

  /* ---------- cart helpers ---------- */
  const tierOf = id => catalog.tiers.find(t => t.id === id);
  const gameOf = id => (catalog.games || []).find(g => g.id === id);
  const itemOf = id => tierOf(id) || gameOf(id);
  const periodOf = id => catalog.periods.find(p => p.id === id);
  const priceOf = i => {
    const g = gameOf(i.t);
    if (g) return i.p === 'g' ? g.price : null;
    const t = tierOf(i.t);
    return t && t.prices[i.p] != null ? t.prices[i.p] : null;
  };
  const lineTitle = i => itemOf(i.t).title;
  const lineShort = i => (gameOf(i.t) ? 'Игра' : periodOf(i.p).short);
  const lineLong = i => (gameOf(i.t) ? 'Игра' : periodOf(i.p).title);
  const HEART = '<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></svg>';
  const favBtn = id => `<button class="fav ${favs.includes(id) ? 'on' : ''}" data-fav="${esc(id)}" aria-label="В избранное">${HEART}</button>`;
  const cartCount = () => cart.reduce((n, i) => n + i.q, 0);
  const cartTotal = () => cart.reduce((n, i) => n + priceOf(i) * i.q, 0);
  const saveCart = () => { store.set('ps_cart', cart); updateTabs(); };
  const saveFavs = () => store.set('ps_fav', favs);

  function addToCart(tierId, periodId) {
    if (gameOf(tierId)) periodId = 'g';
    const line = cart.find(i => i.t === tierId && i.p === periodId);
    if (line) {
      if (line.q >= MAX_QTY) return toast('Можно не больше ' + MAX_QTY + ' штук одного тарифа');
      line.q++;
    } else {

  /* ---------- carousel ---------- */
  let carTimer = null, carPauseUntil = 0;
  const stopCarousel = () => { if (carTimer) { clearInterval(carTimer); carTimer = null; } };
  const slideLeft = (track, el) => Math.max(0, el.offsetLeft - (track.clientWidth - el.offsetWidth) / 2);
  function activeSlide(track) {
    const mid = track.scrollLeft + track.clientWidth / 2;
    let best = 0, bd = Infinity;
    [...track.children].forEach((s, i) => {
      const d = Math.abs(s.offsetLeft + s.offsetWidth / 2 - mid);
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }
  function startCarousel() {
    const track = document.getElementById('carTrack');
    if (!track) return;
    const slides = [...track.children], dots = [...document.querySelectorAll('#carDots .dot')];
    const mark = i => { state.car = i; dots.forEach((d, k) => d.classList.toggle('on', k === i)); };
    track.scrollLeft = slideLeft(track, slides[state.car] || slides[0]);
    mark(activeSlide(track));
    track.addEventListener('scroll', () => mark(activeSlide(track)), { passive: true });
    ['touchstart', 'pointerdown', 'wheel'].forEach(ev =>
      track.addEventListener(ev, () => { carPauseUntil = Date.now() + 8000; }, { passive: true }));
    if (slides.length < 2) return;
    carTimer = setInterval(() => {
      if (Date.now() < carPauseUntil || document.hidden) return;
      const next = (activeSlide(track) + 1) % slides.length;
      track.scrollTo({ left: slideLeft(track, slides[next]), behavior: 'smooth' });
    }, 4500);
  }

  /* ---------- wallet (UA top-up) ---------- */
  const WCFG = () => ({
    rate: catalog.uah_rate != null ? Number(catalog.uah_rate) : 5,
    min: catalog.uah_min || 200,
    max: catalog.uah_max || 50000,
    presets: catalog.uah_presets || [200, 500, 1000, 2000, 4000, 10000]

  const uah = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₴';

  const wAmount = () => { const n = parseInt(String(state.w.amount).replace(/\D/g, ''), 10); return isNaN(n) ? 0 : n; };
  const wValid = () => { const c = WCFG(), n = wAmount(); return n >= c.min && n <= c.max; };
  const wRub = () => Math.floor((wAmount() * Math.round(WCFG().rate * 100) + 50) / 100);
  const wTotal = () => wRub() + (state.w.ua ? uaFee() : 0);

      <div class="ck-row"><span>Пополнение в рублях</span><span>${ok ? money(wRub()) : '—'}</span></div>

      <div class="ck-total"><span>К оплате</span><b>${ok ? money(wTotal()) : '—'}</b></div>

  function reviewFormHtml() {
    const rv = state.rv, send = canSend();
    if (!send) return '';

    const stars = [1,2,3,4,5].map(n => `<span class="${n <= rv.stars ? 'on' : ''}" data-rvstar="${n}">★</span>`).join('');
    return `<div class="ck"><h3 style="font-size:16px;font-weight:800;margin:0 0 8px">Оставить отзыв</h3>

      <div class="rev-stars" id="rvStars">${stars}</div>
      <label class="field" style="margin-top:10px"><textarea id="rvText" rows="4" maxlength="500" placeholder="Напишите отзыв...">${esc(rv.text)}</textarea></label>
      <button class="cta" data-rvsend style="--c:#22c55e;position:static;transform:none;width:100%;margin:10px 0 0">
        <div><b>Отправить отзыв</b></div><span class="go">→</span></button></div>`;

  function submitReview() {
    const rv = state.rv, send = canSend();
    if (!send) return toast('Откройте магазин кнопкой под полем ввода');
    if (!rv.text.trim()) return toast('Напишите текст отзыва');
    state.rv.sent = true;
    tg.sendData(JSON.stringify({ review: { stars: rv.stars, text: rv.text.trim().slice(0, 500) } }));
    render();
  }
  function submitWallet() {
    const w = state.w, send = canSend(), email = w.email.trim();
    if (!wValid()) {
      const el = document.getElementById('wAmount');
      if (el) { el.classList.add('bad'); el.focus(); }
      return toast('Сумма пополнения: от ' + uah(WCFG().min) + ' до ' + uah(WCFG().max));
    }
    if (send && !w.ua && !EMAIL_RE.test(email)) {
      const el = document.getElementById('wEmail');
      if (el) { el.classList.add('bad'); el.focus(); }
      return toast('Укажите email аккаунта PlayStation');
    }
    const amount = wAmount(), total = wTotal();
    const d = new Date(), z = n => String(n).padStart(2, '0');
    const items = [{ title: 'Кошелёк PSN · ' + uah(amount), period: '', q: 1 }];
    if (w.ua) items.push({ title: 'Новый аккаунт', period: '', q: 1 });
    orders.unshift({ date: z(d.getDate()) + '.' + z(d.getMonth() + 1) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()), items, total });
    orders = orders.slice(0, 10);
    store.set('ps_orders', orders);
    if (email) store.set('ps_email', email);
    const payload = { wallet: amount, ua: w.ua, email: w.ua ? '' : email, comment: w.comment.trim().slice(0, 300) };
    const url = 'https://t.me/' + (catalog.bot || 'psstore_Arsenyaga_bot') + '?start=w_' + amount + (w.ua ? '_u' : '');
    w.ua = false; w.comment = '';
    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
    if (send) { tg.sendData(JSON.stringify(payload)); return; }
    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink(url);
      setTimeout(() => { try { tg.close(); } catch (e) {} }, 300);
    } else window.open(url, '_blank');
    go('profile');
  }

  /* ---------- sending the order ---------- */
  function submitOrder() {
    if (!cart.length) return;
    const ck = state.ck, send = canSend();
    const email = ck.email.trim();
    if (send && !ck.ua && !EMAIL_RE.test(email)) {
      const el = document.getElementById('ckEmail');
      if (el) { el.classList.add('bad'); el.focus(); }
      return toast('Укажите email аккаунта PlayStation');
    }
    // Позиции кодируются как <тариф>-<срок>-<кол-во>, например ex-12m-2. Цены бот берёт из своего каталога.
    const codes = cart.map(i => i.t.slice(0, 2) + '-' + i.p + '-' + i.q);
    let url = null;
    if (!send) {
      url = 'https://t.me/' + (catalog.bot || 'psstore_Arsenyaga_bot') + '?start=c_' + codes.join('_') + (ck.ua ? '_u' : '');
      if (url.split('start=')[1].length > 64) return toast('В корзине слишком много позиций. Оформите часть заказа отдельно');
    }
    const d = new Date(), z = n => String(n).padStart(2, '0');
    const items = cart.map(i => ({ title: lineTitle(i), period: gameOf(i.t) ? '' : lineShort(i), q: i.q }));
    if (ck.ua) items.push({ title: 'Новый аккаунт', period: '', q: 1 });
    orders.unshift({ date: z(d.getDate()) + '.' + z(d.getMonth() + 1) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()), items, total: ckTotal() });
    orders = orders.slice(0, 10);
    store.set('ps_orders', orders);
    if (email) store.set('ps_email', email);
    const payload = { items: codes, ua: ck.ua, email: ck.ua ? '' : email, comment: ck.comment.trim().slice(0, 300) };
    cart = [];
    ck.ua = false; ck.comment = '';
    saveCart();
    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
    if (send) { tg.sendData(JSON.stringify(payload)); return; }   // бот получает заявку, окно закрывается
    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink(url);
      // Магазин закрываем сами, иначе на части телефонов он остаётся открытым и кажется, что ничего не произошло
      setTimeout(() => { try { tg.close(); } catch (e) {} }, 300);
    } else window.open(url, '_blank');
    go('profile');
  }

  /* ---------- events ---------- */
  app.addEventListener('input', e => {
    if (e.target.id === 'ckEmail') { state.ck.email = e.target.value; e.target.classList.remove('bad'); }
    else if (e.target.id === 'ckComment') state.ck.comment = e.target.value;
    else if (e.target.id === 'wAmount') {
      const v = e.target.value.replace(/\D/g, '').slice(0, 7);
      if (v !== e.target.value) e.target.value = v;
      state.w.amount = v; e.target.classList.remove('bad'); updateWalletSummary();
    }
    else if (e.target.id === 'wEmail') { state.w.email = e.target.value; e.target.classList.remove('bad'); }
    else if (e.target.id === 'rvText') state.rv.text = e.target.value;
    else if (e.target.id === 'wComment') state.w.comment = e.target.value;

  });

  app.addEventListener('click', e => {
    const el = e.target.closest('[data-tier],[data-period],[data-add],[data-fav],[data-back],[data-contact],[data-tab],[data-inc],[data-dec],[data-rm],[data-clear],[data-checkout],[data-ua],[data-send],[data-ckback],[data-game],[data-wallet],[data-view],[data-menu],[data-wpre],[data-wua],[data-whow],[data-wsend]');
    if (!el) return;
    const d = el.dataset;
    if ('menu' in d) { haptic(); openMenu(); }
    else if (d.tab) { haptic(); go(d.tab); }
    else if (d.tier) { haptic(); go('tier', d.tier); }
    else if (d.game) { haptic(); go('game', d.game); }
    else if (d.period) { haptic(); state.periodId = d.period; render(); }
    else if ('add' in d) addToCart(state.tierId, state.periodId);
    else if (d.fav) {
      favs = favs.includes(d.fav) ? favs.filter(x => x !== d.fav) : favs.concat(d.fav);
      saveFavs(); haptic();
      if (state.view === 'fav') render();
      else document.querySelectorAll('[data-fav]').forEach(b => b.classList.toggle('on', favs.includes(b.dataset.fav)));
    }
    else if ('back' in d) go(backTarget());
    else if (d.inc != null) { const l = cart[+d.inc]; if (l && l.q < MAX_QTY) { l.q++; saveCart(); render(); } }
    else if (d.dec != null) { const l = cart[+d.dec]; if (l) { if (l.q > 1) l.q--; else cart.splice(+d.dec, 1); saveCart(); render(); } }
    else if (d.rm != null) { cart.splice(+d.rm, 1); saveCart(); render(); }
    else if ('clear' in d) { cart = []; saveCart(); render(); }
    else if ('checkout' in d) { haptic(); go('checkout'); }
    else if ('ua' in d) { state.ck.ua = !state.ck.ua; haptic(); render(); }
    else if ('send' in d) submitOrder();
    else if ('wallet' in d) { haptic(); go('wallet'); }
    else if (d.view) { haptic(); go(d.view); }
    else if (d.wpre) { haptic(); state.w.amount = d.wpre; document.getElementById('wAmount').value = d.wpre; updateWalletSummary(); }
    else if (d.rvstar) { state.rv.stars = +d.rvstar; document.querySelectorAll('#rvStars span').forEach(x => x.classList.toggle('on', +x.dataset.rvstar <= state.rv.stars)); haptic(); }
    else if ('rvsend' in d) submitReview();
    else if ('wua' in d) { state.w.ua = !state.w.ua; haptic(); render(); }
    else if ('whow' in d) { state.w.how = !state.w.how; render(); }
    else if ('wsend' in d) submitWallet();
    else if ('ckback' in d) go('cart');
    else if ('contact' in d) {
      const url = 'https://t.me/' + catalog.contact;
      tg && tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, '_blank');
    }
  });

    if (tg) {
      try {
        tg.ready(); tg.expand();
        tg.setHeaderColor('#2b0d6e'); tg.setBackgroundColor('#0a0b1f');
        tg.BackButton.onClick(() => go(state.view === 'checkout' ? 'cart' : backTarget()));
      } catch (e) {}
    }
    try {
      catalog = await loadCatalog();
      cart = store.get('ps_cart', []).filter(i => i && priceOf(i) != null)
        .map(i => ({ t: i.t, p: i.p, q: Math.min(MAX_QTY, Math.max(1, i.q | 0)) })).slice(0, MAX_LINES);
      favs = store.get('ps_fav', []).filter(id => itemOf(id));
      orders = store.get('ps_orders', []);
      state.ck.email = store.get('ps_email', '') || ''; state.w.email = state.ck.email;
      render();
    } catch (e) {
      app.innerHTML = '<div class="err">Не удалось загрузить каталог.<br>Попробуйте открыть магазин ещё раз.</div>';
    }
  })();
})();
</script>
</body>
</html>
