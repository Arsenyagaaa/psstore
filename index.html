<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>PS Plus</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b1f; --card:#12162f; --text:#fff; --muted:#8d93b9;
  --green:#52e5a3; --yellow:#ffd35c;
  --display:'Unbounded','Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}

/* ---------- Hero ---------- */
.hero{
  position:relative;overflow:hidden;padding:20px 20px 0;
  background:linear-gradient(180deg,#2b0d6e 0%,#5a1aa0 28%,#b92f9c 60%,#ff5f86 82%,#ff8f78 100%);
}
.hero-home{min-height:335px}
.hero-tier{min-height:300px}
.hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.pill{
  border:1.5px solid var(--yellow);color:var(--yellow);border-radius:999px;
  padding:6px 14px;font-weight:800;letter-spacing:.08em;font-size:13px;white-space:nowrap
}
.hero-sub{font-size:14px;font-weight:600;color:#f3e9ff}
.back{
  width:34px;height:34px;border-radius:50%;background:rgba(10,4,32,.45);
  color:#fff;font-size:22px;line-height:32px;text-align:center;flex:none
}
h1{
  font-family:var(--display);font-weight:800;font-size:31px;line-height:1.12;
  margin-top:18px;position:relative;z-index:2;max-width:78%
}
h1 em{font-style:normal;color:var(--yellow)}
.tier-title{font-size:44px;max-width:100%}
.tagline{
  position:relative;z-index:2;margin-top:10px;font-size:17px;font-weight:700;
  line-height:1.3;max-width:62%;color:#fff
}
.hero-art{position:absolute;left:0;bottom:0;width:100%;height:auto;display:block;pointer-events:none;z-index:1}

/* ---------- Home: tiers ---------- */
.tiers{padding:16px 16px 0;display:grid;gap:12px}
.tier{
  width:100%;background:var(--card);border-radius:20px;padding:16px 16px 14px 20px;
  box-shadow:inset 5px 0 0 var(--c);position:relative
}
.tier-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tier-name{font-family:var(--display);font-weight:800;font-size:22px;color:var(--c)}
.tier-desc{font-size:13px;color:var(--muted);margin-top:4px;font-weight:600}
.chev{font-size:26px;color:var(--muted);line-height:1}
.tier-prices{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;margin-top:14px}
.tp{display:flex;flex-direction:column;gap:3px;min-width:0}
.tp-l{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tp.best .tp-l{color:var(--green)}
.badge{background:var(--green);color:#06210f;border-radius:6px;padding:1px 5px;font-size:9px;font-weight:800;letter-spacing:.02em}
.tp-p{font-family:var(--display);font-weight:800;font-size:15px;white-space:nowrap}
.tp.best .tp-p{color:var(--c)}
.tp-s{font-size:11px;color:var(--green);font-weight:700}
.tp-s.base{color:var(--muted)}
.note{margin:14px 20px 0;font-size:12px;color:var(--muted);line-height:1.4}
.contact{
  display:block;margin:18px 16px 0;width:calc(100% - 32px);background:#ffd35c;color:#0a0b1f;
  border-radius:20px;padding:16px 18px;font-weight:800;font-size:15px
}
.contact small{display:block;font-size:12px;font-weight:700;opacity:.7;margin-top:3px}

/* ---------- Tier page ---------- */
.card{background:var(--card);border-radius:22px;padding:20px}
.features{list-style:none;display:grid;gap:14px;margin:16px 16px 0}
.features li{display:flex;gap:12px;align-items:center;font-size:15.5px;font-weight:600;line-height:1.3}
.features svg{flex:none;width:24px;height:24px}
.periods{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px;margin:14px 16px 0}
.period{
  background:var(--card);border:2px solid transparent;border-radius:18px;padding:14px 12px;min-width:0;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start
}
.period.sel{border-color:var(--c)}
.pl{font-size:12px;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.period.sel .pl{color:var(--c)}
.pp{font-family:var(--display);font-weight:800;font-size:18px;margin-top:6px;white-space:nowrap}
.period.sel .pp{color:var(--c)}
.ps{font-size:11px;font-weight:700;color:var(--green);margin-top:5px;line-height:1.3}
.ps.base{color:var(--muted)}
.why{
  margin:14px 16px 0;border:1.5px dashed var(--c);border-radius:20px;padding:16px;
  background:rgba(255,255,255,.02)
}
.why h4{color:var(--c);font-size:12px;letter-spacing:.07em;font-weight:800}
.why p{margin-top:8px;font-size:15px;line-height:1.45;font-weight:600}
.cta{
  position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));
  margin:16px 16px 0;width:calc(100% - 32px);border-radius:20px;padding:16px 18px;
  background:var(--c);color:#0a0b1f;display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5
}
.cta b{font-family:var(--display);font-weight:800;font-size:17px;display:block}
.cta small{font-size:12px;font-weight:800;opacity:.75;display:block;margin-top:5px}
.cta .go{font-weight:800;font-size:15px;white-space:nowrap}
.cta:active,.tier:active,.period:active,.contact:active{transform:scale(.985)}

/* ---------- Tab bar ---------- */
.tabbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;
  display:grid;grid-template-columns:repeat(4,1fr);background:rgba(14,16,40,.97);
  border-top:1px solid #232850;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30
}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative;text-align:center;padding:4px 0}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--yellow)}
.cnt{
  position:absolute;top:-3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;padding:0 5px;
  background:#ff5aa8;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center
}
.cnt[hidden]{display:none}
.hero-mini{padding-bottom:22px}
.hero-mini h1{max-width:100%;font-size:26px;margin-top:14px}
.fav{
  margin-left:auto;width:34px;height:34px;border-radius:50%;background:rgba(10,4,32,.45);
  display:flex;align-items:center;justify-content:center;flex:none
}
.fav svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fav.on svg{fill:#ff5aa8;stroke:#ff5aa8}

/* ---------- Cart / Profile ---------- */
.page{padding:16px 16px 0;display:grid;gap:12px}
.line{background:var(--card);border-radius:20px;padding:14px 14px 12px 18px;box-shadow:inset 5px 0 0 var(--c);display:grid;gap:10px}
.line-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.line-name{font-family:var(--display);font-weight:800;font-size:18px;color:var(--c)}
.line-sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:3px}
.line-price{font-family:var(--display);font-weight:800;font-size:15px;white-space:nowrap}
.line-bot{display:flex;justify-content:space-between;align-items:center}
.qty{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:14px;padding:4px}
.qty button{width:34px;height:34px;border-radius:10px;background:#1b2042;font-size:20px;font-weight:800;text-align:center}
.qty span{min-width:28px;text-align:center;font-weight:800}
.rm{font-size:13px;color:var(--muted);font-weight:700;padding:8px}
.sum{background:var(--card);border-radius:20px;padding:16px 18px;display:grid;gap:8px}
.sum-row{display:flex;justify-content:space-between;font-weight:700;font-size:14px;color:var(--muted)}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.sum-total b{font-family:var(--display);font-size:20px;color:var(--yellow)}
.link{display:block;margin:2px auto 0;color:var(--muted);font-size:13px;font-weight:700;padding:8px;text-align:center}
.empty{padding:40px 24px 10px;text-align:center;color:var(--muted);font-weight:600;line-height:1.45}
.empty b{display:block;color:var(--text);font-family:var(--display);font-size:18px;margin-bottom:8px}
.btn{
  display:block;margin:18px auto 0;background:var(--yellow);color:#0a0b1f;border-radius:16px;
  padding:14px 22px;font-weight:800;font-size:15px;text-align:center
}
.me{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:16px 18px}
.avatar{
  width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#ff5aa8,#b58cff);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px;flex:none
}
.me-name{font-weight:800;font-size:17px}
.me-sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.sec{font-weight:800;font-size:14px;color:var(--muted);margin:6px 4px 0}
.ord{background:var(--card);border-radius:18px;padding:14px 16px;display:grid;gap:6px;font-size:14px;font-weight:600}
.ord-h{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;font-weight:700}
.ord-t{font-weight:800;color:var(--yellow)}
.ck{background:var(--card);border-radius:20px;padding:16px 18px;display:grid;gap:10px}
.ck h3{font-size:15px;font-weight:800}
.ck-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;color:var(--muted)}
.ck-row span:last-child{color:var(--text);white-space:nowrap}
.ck-total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;border-top:1px solid #232850;padding-top:12px;margin-top:2px}
.ck-total b{font-family:var(--display);font-size:20px;color:var(--yellow)}
.chk{display:flex;gap:14px;align-items:center;width:100%;background:var(--card);border-radius:20px;padding:16px 18px;font-weight:700;font-size:15px;line-height:1.35}
.box{
  width:26px;height:26px;border-radius:8px;border:2px solid #4a5086;flex:none;
  display:flex;align-items:center;justify-content:center
}
.chk.on .box{background:var(--yellow);border-color:var(--yellow)}
.box svg{width:16px;height:16px;fill:none;stroke:#0a0b1f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on .box svg{opacity:1}
.field{display:grid;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field textarea{
  width:100%;background:var(--bg);color:var(--text);border:2px solid transparent;border-radius:14px;
  padding:14px;font:inherit;font-size:16px;font-weight:600;outline:none;resize:none
}
.field input:focus,.field textarea:focus{border-color:var(--yellow)}
.field input.bad{border-color:#ff5a6e}
.tiny{font-size:12px;color:var(--muted);line-height:1.4;margin:2px 6px 0}
#toast{
  position:fixed;left:50%;bottom:160px;transform:translate(-50%,20px);opacity:0;
  background:#222849;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:700;
  max-width:88%;text-align:center;transition:.25s;pointer-events:none;z-index:20
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.err{padding:60px 24px;text-align:center;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="sunG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ff8f8f"/>
    </linearGradient>
    <symbol id="palm" viewBox="-12 -14 132 190">
      <g fill="#0a0420" stroke="#0a0420" stroke-linecap="round">
        <path d="M50 176 Q 44 100 52 42" fill="none" stroke-width="6"/>
        <path d="M52 42 Q 20 8 -8 36 Q 24 26 52 42 Z" stroke-width="1"/>
        <path d="M52 42 Q 22 32 2 68 Q 30 46 52 42 Z" stroke-width="1"/>
        <path d="M52 42 Q 84 8 112 36 Q 80 26 52 42 Z" stroke-width="1"/>
        <path d="M52 42 Q 82 32 102 68 Q 74 46 52 42 Z" stroke-width="1"/>
        <path d="M52 42 Q 44 14 60 -10 Q 58 22 52 42 Z" stroke-width="1"/>
      </g>
    </symbol>
  </defs>
</svg>

<div id="app"></div>
<div id="toast"></div>
<nav class="tabbar" id="tabs" aria-label="Разделы">
  <button class="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg>Главная</button>
  <button class="tab" data-tab="fav"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></svg>Избранное</button>
  <button class="tab" data-tab="cart"><svg viewBox="0 0 24 24"><path d="M3 4h2.6l2.2 11h10.4l2-8H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>Корзина<b class="cnt" id="cartCnt" hidden>0</b></button>
  <button class="tab" data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c.8-4 3.7-5.8 7.5-5.8s6.7 1.8 7.5 5.8"/></svg>Профиль</button>
</nav>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const app = document.getElementById('app');
  const state = { view: 'home', tab: 'home', tierId: null, periodId: null, ck: { ua: false, email: '', comment: '' } };
  const EMAIL_RE = /^[^@\s]{1,64}@[^@\s]{1,190}\.[^@\s]{2,20}$/;
  let catalog = null;
  let cart = [], favs = [], orders = [];
  const MAX_LINES = 6, MAX_QTY = 9;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ---------- helpers ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
  const money = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ' + catalog.currency;
  const tierPeriods = t => catalog.periods.filter(p => t.prices[p.id] != null);
  const saving = (t, p) => {
    const base = t.prices['1m'];
    if (!base || p.months === 1) return 0;
    return Math.round((1 - t.prices[p.id] / (base * p.months)) * 100);
  };
  const perMonth = (t, p) => Math.round(t.prices[p.id] / p.months);
  const bestPeriod = t => { const ps = tierPeriods(t); return ps[ps.length - 1]; };
  const rnd = seed => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
  const haptic = kind => { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} };

  function toast(text) {
    const el = document.getElementById('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove('show'), 3200);
  }

  /* ---------- illustration ---------- */
  function figure(x, y, c, pad, pony) {
    return `<g transform="translate(${x} ${y})" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="#0a0420">
      <rect x="-15" y="-36" width="11" height="40" rx="5.5"/>
      <rect x="4" y="-36" width="11" height="40" rx="5.5"/>
      ${pony ? '<path d="M11 -100 q 22 -6 15 22 q -3 -13 -13 -13 z"/>' : ''}
      <circle cx="0" cy="-92" r="15"/>
      <rect x="-24" y="-76" width="48" height="46" rx="15"/>
      <rect x="-13" y="-52" width="26" height="10" rx="5" fill="${pad}" stroke="none"/>
    </g>`;
  }

  function heroSvg(h, opt) {
    const W = 400, r = rnd(opt.seed || 7);
    const cols = ['#2fd4ff', '#ffd35c', '#ff5aa8'];
    let stars = '', bld = '', win = '', x = 0;
    for (let i = 0; i < 16; i++) {
      stars += `<circle cx="${Math.floor(r() * W)}" cy="${Math.floor(r() * h * 0.45)}" r="${(0.8 + r() * 0.8).toFixed(1)}" fill="#fff" opacity="${(0.4 + r() * 0.5).toFixed(2)}"/>`;
    }
    while (x < W) {
      const w = 26 + Math.floor(r() * 30);
      const centre = Math.abs(x + w / 2 - opt.sunX) / 200;
      const f = Math.min(1, 0.42 + centre * 0.9);
      const bh = Math.round((34 + r() * 50) * f);
      bld += `<rect x="${x}" y="${h - bh}" width="${w}" height="${bh}" fill="#150840"/>`;
      const n = 1 + Math.floor(r() * 3);
      for (let i = 0; i < n; i++) {
        win += `<rect x="${x + 4 + Math.floor(r() * (w - 12))}" y="${h - bh + 6 + Math.floor(r() * Math.max(1, bh - 16))}" width="4" height="4" fill="${cols[Math.floor(r() * 3)]}"/>`;
      }
      x += w;
    }
    const palms = (opt.palms || []).map(p =>
      `<use href="#palm" ${p.flip ? `transform="translate(${W} 0) scale(-1 1)"` : ''} x="${p.x}" y="${h - p.h + 6}" width="${Math.round(p.h * 0.7)}" height="${p.h}"/>`
    ).join('');
    const figs = (opt.figs || []).map(f => figure(f.x, h + 4, f.c, f.pad, f.pony)).join('');
    return `<svg class="hero-art" viewBox="0 0 ${W} ${h}" aria-hidden="true">
      ${stars}
      <circle cx="${opt.sunX}" cy="${h - 4}" r="${opt.sunR}" fill="url(#sunG)"/>
      ${bld}${win}${palms}${figs}
    </svg>`;
  }

  /* ---------- cart helpers ---------- */
  const tierOf = id => catalog.tiers.find(t => t.id === id);
  const periodOf = id => catalog.periods.find(p => p.id === id);
  const priceOf = i => { const t = tierOf(i.t); return t && t.prices[i.p] != null ? t.prices[i.p] : null; };
  const cartCount = () => cart.reduce((n, i) => n + i.q, 0);
  const cartTotal = () => cart.reduce((n, i) => n + priceOf(i) * i.q, 0);
  const saveCart = () => { store.set('ps_cart', cart); updateTabs(); };
  const saveFavs = () => store.set('ps_fav', favs);

  function addToCart(tierId, periodId) {
    const line = cart.find(i => i.t === tierId && i.p === periodId);
    if (line) {
      if (line.q >= MAX_QTY) return toast('Можно не больше ' + MAX_QTY + ' штук одного тарифа');
      line.q++;
    } else {
      if (cart.length >= MAX_LINES) return toast('В корзине не больше ' + MAX_LINES + ' позиций. Оформите заказ, потом добавьте остальное');
      cart.push({ t: tierId, p: periodId, q: 1 });
    }
    saveCart();
    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
    const t = tierOf(tierId), p = periodOf(periodId);
    toast(t.title + ' · ' + p.short + ' добавлен в корзину');
    render();
  }

  function updateTabs() {
    document.querySelectorAll('.tab').forEach(el => el.classList.toggle('on', el.dataset.tab === state.tab));
    const c = document.getElementById('cartCnt'), n = cart.length ? cartCount() : 0;
    c.textContent = n; c.hidden = !n;
  }

  /* ---------- views ---------- */
  function tierCard(t) {
    const ps = tierPeriods(t), best = bestPeriod(t);
    const cols = ps.map(p => {
      const s = saving(t, p);
      return `<div class="tp ${p === best ? 'best' : ''}">
        <span class="tp-l">${esc(p.short)}${p === best ? '<b class="badge">ВЫГОДНО</b>' : ''}</span>
        <span class="tp-p">${money(t.prices[p.id])}</span>
        <span class="tp-s ${s ? '' : 'base'}">${s ? 'выгода ' + s + '%' : 'базовая цена'}</span>
      </div>`;
    }).join('');
    return `<button class="tier" data-tier="${esc(t.id)}" style="--c:${esc(t.color)}">
      <div class="tier-head">
        <div><div class="tier-name">${esc(t.title)}</div><div class="tier-desc">${esc(t.short)}</div></div>
        <span class="chev">›</span>
      </div>
      <div class="tier-prices" style="--n:${ps.length}">${cols}</div>
    </button>`;
  }

  function miniHero(title) {
    return `<section class="hero hero-mini">
      <div class="hero-top"><span class="pill">PS PLUS</span><span class="hero-sub">Подписки для PlayStation</span></div>
      <h1>${esc(title)}</h1>
    </section>`;
  }

  function renderHome() {
    const art = heroSvg(250, {
      seed: 11, sunX: 200, sunR: 82,
      palms: [{ x: -22, h: 150 }, { x: -22, h: 150, flip: true }],
      figs: [
        { x: 112, c: '#ff4fa3', pad: '#2fd4ff' },
        { x: 288, c: '#2fd4ff', pad: '#ff4fa3', pony: true }
      ]
    });
    const cards = catalog.tiers.map(tierCard).join('');
    const contact = catalog.contact
      ? `<button class="contact" data-contact>Остались вопросы?<small>Пишите в Telegram: @${esc(catalog.contact)}</small></button>` : '';
    app.innerHTML = `
      <section class="hero hero-home">
        <div class="hero-top"><span class="pill">PS PLUS</span><span class="hero-sub">Подписки для PlayStation</span></div>
        <h1>Выбери свой <em>тариф</em> и играй</h1>
        ${art}
      </section>
      <main>
        <div class="tiers">${cards}</div>
        ${catalog.note ? `<p class="note">${esc(catalog.note)}</p>` : ''}
        ${contact}
      </main>`;
  }

  function renderFav() {
    const list = catalog.tiers.filter(t => favs.includes(t.id));
    const body = list.length
      ? `<div class="tiers">${list.map(tierCard).join('')}</div>`
      : `<div class="empty"><b>Пока пусто</b>Нажмите сердечко на странице тарифа, и он появится здесь.<button class="btn" data-tab="home">Выбрать тариф</button></div>`;
    app.innerHTML = miniHero('Избранное') + `<main>${body}</main>`;
  }

  function renderCart() {
    if (!cart.length) {
      app.innerHTML = miniHero('Корзина') + `<main><div class="empty"><b>Корзина пуста</b>Добавьте тариф, можно сразу несколько.<button class="btn" data-tab="home">Выбрать тариф</button></div></main>`;
      return;
    }
    const lines = cart.map((i, n) => {
      const t = tierOf(i.t), p = periodOf(i.p);
      return `<div class="line" style="--c:${esc(t.color)}">
        <div class="line-top">
          <div><div class="line-name">${esc(t.title)}</div><div class="line-sub">${esc(p.title)} · ${money(priceOf(i))} за шт.</div></div>
          <div class="line-price">${money(priceOf(i) * i.q)}</div>
        </div>
        <div class="line-bot">
          <div class="qty"><button data-dec="${n}" aria-label="Меньше">−</button><span>${i.q}</span><button data-inc="${n}" aria-label="Больше">+</button></div>
          <button class="rm" data-rm="${n}">Удалить</button>
        </div>
      </div>`;
    }).join('');
    app.innerHTML = miniHero('Корзина') + `<main class="page">
      ${lines}
      <div class="sum">
        <div class="sum-row"><span>Позиций</span><span>${cart.length}</span></div>
        <div class="sum-row"><span>Подписок всего</span><span>${cartCount()}</span></div>
        <div class="sum-total"><span>Итого</span><b>${money(cartTotal())}</b></div>
      </div>
      <button class="cta" data-checkout style="--c:var(--yellow)">
        <div><b>Оформить заказ</b><small>Менеджер свяжется с вами для оплаты</small></div>
        <span class="go">Дальше →</span>
      </button>
      <button class="link" data-clear>Очистить корзину</button>
    </main>`;
  }

  function canSend() {
    const kb = new URLSearchParams(location.search).get('kb') === '1';
    return kb && !!tg && typeof tg.sendData === 'function';
  }
  const uaFee = () => (catalog.ua_account_fee != null ? catalog.ua_account_fee : 80);
  const ckTotal = () => cartTotal() + (state.ck.ua ? uaFee() : 0);

  function renderCheckout() {
    if (!cart.length) { state.view = 'cart'; return renderCart(); }
    const ck = state.ck, send = canSend();
    const rows = cart.map(i => {
      const t = tierOf(i.t), p = periodOf(i.p);
      return `<div class="ck-row"><span>${esc(t.title)} · ${esc(p.short)}${i.q > 1 ? ' × ' + i.q : ''}</span><span>${money(priceOf(i) * i.q)}</span></div>`;
    }).join('');
    const feeRow = ck.ua ? `<div class="ck-row"><span>Новый украинский аккаунт</span><span>${money(uaFee())}</span></div>` : '';
    const tick = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

    let account;
    if (ck.ua) {
      account = '<p class="tiny" style="margin:0 6px">Аккаунт создадим за вас. Данные для входа менеджер пришлёт в чате.</p>';
    } else if (send) {
      account = `<div class="ck"><h3>Аккаунт</h3>
        <label class="field">Email аккаунта PlayStation *
          <input id="ckEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" value="${esc(ck.email)}">
        </label>
        <p class="tiny" style="margin:0">Пароль здесь вводить не нужно.</p></div>`;
    } else {
      account = '<p class="tiny" style="margin:0 6px">Email аккаунта менеджер уточнит в чате. Чтобы указать его здесь, откройте магазин кнопкой «Открыть магазин» под полем ввода в чате с ботом.</p>';
    }
    const comment = send ? `<div class="ck"><label class="field">Комментарий для менеджера · необязательно
        <textarea id="ckComment" rows="3" maxlength="300">${esc(ck.comment)}</textarea></label></div>` : '';

    app.innerHTML = `
      <section class="hero hero-mini">
        <div class="hero-top"><button class="back" data-ckback aria-label="Назад">‹</button><span class="pill">PS PLUS</span><span class="hero-sub">Подписки для PlayStation</span></div>
        <h1>Оформление заказа</h1>
      </section>
      <main class="page">
        <div class="ck"><h3>Состав заказа</h3>${rows}${feeRow}
          <div class="ck-total"><span>Итого</span><b>${money(ckTotal())}</b></div></div>
        <button class="chk ${ck.ua ? 'on' : ''}" data-ua><span class="box">${tick}</span><span>Нет аккаунта — создать украинский: ${money(uaFee())}</span></button>
        ${account}
        ${comment}
        <button class="cta" data-send style="--c:var(--yellow)">
          <div><b>Отправить заявку</b><small>К оплате ${money(ckTotal())} · оплату согласует менеджер</small></div>
          <span class="go">Готово →</span>
        </button>
      </main>`;
  }

  function renderProfile() {
    const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
    const name = u ? [u.first_name, u.last_name].filter(Boolean).join(' ') : 'Гость';
    const sub = u && u.username ? '@' + u.username : 'Telegram';
    const hist = orders.length
      ? orders.map(o => `<div class="ord">
          <div class="ord-h"><span>${esc(o.date)}</span><span>Отправлена боту</span></div>
          ${o.items.map(i => `<div>${esc(i.title)}${i.period ? ' · ' + esc(i.period) : ''}${i.q > 1 ? ' × ' + i.q : ''}</div>`).join('')}
          <div class="ord-t">${money(o.total)}</div>
        </div>`).join('')
      : '<p class="tiny">Заявок пока нет. После оформления они появятся здесь.</p>';
    const contact = catalog.contact
      ? `<button class="contact" data-contact style="margin:2px 0 0;width:100%">Поддержка<small>Пишите в Telegram: @${esc(catalog.contact)}</small></button>` : '';
    app.innerHTML = miniHero('Профиль') + `<main class="page">
      <div class="me"><div class="avatar">${esc(name.charAt(0).toUpperCase())}</div><div><div class="me-name">${esc(name)}</div><div class="me-sub">${esc(sub)}</div></div></div>
      <div class="sec">Мои заявки</div>
      ${hist}
      <p class="tiny">История хранится на этом устройстве. Статус оплаты и выдачи подтверждает менеджер в чате.</p>
      ${contact}
    </main>`;
  }

  function renderTier() {
    const idx = catalog.tiers.findIndex(t => t.id === state.tierId);
    const t = catalog.tiers[idx];
    if (!t) { state.view = 'home'; return renderHome(); }
    const ps = tierPeriods(t);
    if (!ps.find(p => p.id === state.periodId)) state.periodId = bestPeriod(t).id;
    const sel = ps.find(p => p.id === state.periodId);

    const figKinds = t.figures || ['boy'];
    const figs = figKinds.length === 1
      ? [{ x: 318, c: t.color, pad: t.color, pony: figKinds[0] === 'girl' }]
      : [{ x: 268, c: t.color, pad: t.color }, { x: 340, c: t.color, pad: t.color, pony: true }];
    const art = heroSvg(200, {
      seed: 3 + idx, sunX: figKinds.length === 1 ? 318 : 304, sunR: 66,
      palms: [{ x: 168, h: 130 }, { x: 4, h: 118, flip: true }],
      figs
    });
    const check = `<svg viewBox="0 0 24 24" fill="none" stroke="${esc(t.color)}" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const feats = t.features.map(f => `<li>${check}<span>${esc(f)}</span></li>`).join('');
    const periods = ps.map(p => {
      const s = saving(t, p), best = p === bestPeriod(t) && ps.length > 1;
      const sub = s ? `выгода ${s}%${p.months >= 12 ? ' · ≈' + perMonth(t, p) + ' ₽/мес' : ''}` : 'базовая цена';
      return `<button class="period ${p.id === state.periodId ? 'sel' : ''}" data-period="${esc(p.id)}">
        <span class="pl">${esc(p.short)}${best ? '<b class="badge">ВЫГОДНО</b>' : ''}</span>
        <div class="pp">${money(t.prices[p.id])}</div>
        <div class="ps ${s ? '' : 'base'}">${sub}</div>
      </button>`;
    }).join('');

    app.innerHTML = `
      <section class="hero hero-tier" style="--c:${esc(t.color)}">
        <div class="hero-top">
          <button class="back" data-back aria-label="Назад">‹</button>
          <span class="pill">PS PLUS</span>
          <span class="hero-sub">Тариф ${idx + 1} из ${catalog.tiers.length}</span>
          <button class="fav ${favs.includes(t.id) ? 'on' : ''}" data-fav="${esc(t.id)}" aria-label="В избранное"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></svg></button>
        </div>
        <h1 class="tier-title" style="color:${esc(t.color)}">${esc(t.title)}</h1>
        <p class="tagline">${esc(t.tagline)}</p>
        ${art}
      </section>
      <main style="--c:${esc(t.color)}">
        <ul class="features card">${feats}</ul>
        <div class="periods" style="--n:${ps.length}">${periods}</div>
        <div class="why"><h4>ПОЧЕМУ СТОИТ ВЗЯТЬ</h4><p>${esc(t.why)}</p></div>
        <button class="cta" data-add>
          <div><b>В корзину</b><small>${esc(t.title)} · ${esc(sel.title)} · ${money(t.prices[sel.id])}</small></div>
          <span class="go">Добавить +</span>
        </button>
      </main>`;
  }

  function render() {
    const y = window.scrollY;
    ({ home: renderHome, fav: renderFav, cart: renderCart, checkout: renderCheckout, profile: renderProfile, tier: renderTier }[state.view] || renderHome)();
    window.scrollTo(0, y);
    updateTabs();
    if (tg && tg.BackButton) { (state.view === 'tier' || state.view === 'checkout') ? tg.BackButton.show() : tg.BackButton.hide(); }
  }

  function go(view, tierId) {
    state.view = view; state.tierId = tierId || null; state.periodId = null;
    if (view !== 'tier' && view !== 'checkout') state.tab = view;
    document.getElementById('toast').classList.remove('show');
    app.innerHTML = '';
    render();
    window.scrollTo(0, 0);
  }

  /* ---------- sending the order ---------- */
  function submitOrder() {
    if (!cart.length) return;
    const ck = state.ck, send = canSend();
    const email = ck.email.trim();
    if (send && !ck.ua && !EMAIL_RE.test(email)) {
      const el = document.getElementById('ckEmail');
      if (el) { el.classList.add('bad'); el.focus(); }
      return toast('Укажите email аккаунта PlayStation');
    }
    // Позиции кодируются как <тариф>-<срок>-<кол-во>, например ex-12m-2. Цены бот берёт из своего каталога.
    const codes = cart.map(i => i.t.slice(0, 2) + '-' + i.p + '-' + i.q);
    let url = null;
    if (!send) {
      url = 'https://t.me/' + (catalog.bot || 'psstore_Arsenyaga_bot') + '?start=c_' + codes.join('_') + (ck.ua ? '_u' : '');
      if (url.split('start=')[1].length > 64) return toast('В корзине слишком много позиций. Оформите часть заказа отдельно');
    }
    const d = new Date(), z = n => String(n).padStart(2, '0');
    const items = cart.map(i => ({ title: tierOf(i.t).title, period: periodOf(i.p).short, q: i.q }));
    if (ck.ua) items.push({ title: 'Украинский аккаунт', period: '', q: 1 });
    orders.unshift({ date: z(d.getDate()) + '.' + z(d.getMonth() + 1) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()), items, total: ckTotal() });
    orders = orders.slice(0, 10);
    store.set('ps_orders', orders);
    if (email) store.set('ps_email', email);
    const payload = { items: codes, ua: ck.ua, email: ck.ua ? '' : email, comment: ck.comment.trim().slice(0, 300) };
    cart = [];
    ck.ua = false; ck.comment = '';
    saveCart();
    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
    if (send) { tg.sendData(JSON.stringify(payload)); return; }   // бот получает заявку, окно закрывается
    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink(url);
      // Магазин закрываем сами, иначе на части телефонов он остаётся открытым и кажется, что ничего не произошло
      setTimeout(() => { try { tg.close(); } catch (e) {} }, 300);
    } else window.open(url, '_blank');
    go('profile');
  }

  /* ---------- events ---------- */
  app.addEventListener('input', e => {
    if (e.target.id === 'ckEmail') { state.ck.email = e.target.value; e.target.classList.remove('bad'); }
    else if (e.target.id === 'ckComment') state.ck.comment = e.target.value;
  });

  document.getElementById('tabs').addEventListener('click', e => {
    const el = e.target.closest('[data-tab]');
    if (el) { haptic(); go(el.dataset.tab); }
  });

  app.addEventListener('click', e => {
    const el = e.target.closest('[data-tier],[data-period],[data-add],[data-fav],[data-back],[data-contact],[data-tab],[data-inc],[data-dec],[data-rm],[data-clear],[data-checkout],[data-ua],[data-send],[data-ckback]');
    if (!el) return;
    const d = el.dataset;
    if (d.tab) { haptic(); go(d.tab); }
    else if (d.tier) { haptic(); go('tier', d.tier); }
    else if (d.period) { haptic(); state.periodId = d.period; render(); }
    else if ('add' in d) addToCart(state.tierId, state.periodId);
    else if (d.fav) {
      favs = favs.includes(d.fav) ? favs.filter(x => x !== d.fav) : favs.concat(d.fav);
      saveFavs(); haptic(); render();
    }
    else if ('back' in d) go(state.tab);
    else if (d.inc != null) { const l = cart[+d.inc]; if (l && l.q < MAX_QTY) { l.q++; saveCart(); render(); } }
    else if (d.dec != null) { const l = cart[+d.dec]; if (l) { if (l.q > 1) l.q--; else cart.splice(+d.dec, 1); saveCart(); render(); } }
    else if (d.rm != null) { cart.splice(+d.rm, 1); saveCart(); render(); }
    else if ('clear' in d) { cart = []; saveCart(); render(); }
    else if ('checkout' in d) { haptic(); go('checkout'); }
    else if ('ua' in d) { state.ck.ua = !state.ck.ua; haptic(); render(); }
    else if ('send' in d) submitOrder();
    else if ('ckback' in d) go('cart');
    else if ('contact' in d) {
      const url = 'https://t.me/' + catalog.contact;
      tg && tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, '_blank');
    }
  });

  /* ---------- start ---------- */
  async function loadCatalog() {
    if (window.__CATALOG__) return window.__CATALOG__;
    const r = await fetch('catalog.json?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  (async () => {
    if (tg) {
      try {
        tg.ready(); tg.expand();
        tg.setHeaderColor('#2b0d6e'); tg.setBackgroundColor('#0a0b1f');
        tg.BackButton.onClick(() => go(state.view === 'checkout' ? 'cart' : state.tab));
      } catch (e) {}
    }
    try {
      catalog = await loadCatalog();
      cart = store.get('ps_cart', []).filter(i => i && priceOf(i) != null)
        .map(i => ({ t: i.t, p: i.p, q: Math.min(MAX_QTY, Math.max(1, i.q | 0)) })).slice(0, MAX_LINES);
      favs = store.get('ps_fav', []).filter(id => tierOf(id));
      orders = store.get('ps_orders', []);
      state.ck.email = store.get('ps_email', '') || '';
      render();
    } catch (e) {
      app.innerHTML = '<div class="err">Не удалось загрузить каталог.<br>Попробуйте открыть магазин ещё раз.</div>';
    }
  })();
})();
</script>
</body>
</html>
