<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>LUMO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090617;
  --card:#120d29;
  --card2:#1b143c;
  --text:#ffffff;
  --muted:#a59ec9;
  --yellow:#ffd644;
  --green:#4ce39c;
  --pink:#ff4fa3;
  --cyan:#38d6ff;
  --purple:#9d6bff;
  --sunset-top:#1c094d;
  --sunset-mid:#9b1d78;
  --sunset-bot:#ff7a3d;
  --line:#2a2052;
  --display:'Unbounded','Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}

.top-wrap{
  position:relative;
  background:linear-gradient(180deg,var(--sunset-top) 0%,var(--sunset-mid) 48%,var(--sunset-bot) 82%,var(--bg) 100%);
  padding:14px 16px 18px;
  overflow:hidden;
}
.top-wrap::after{
  content:"";
  position:absolute;left:0;right:0;bottom:0;height:64px;pointer-events:none;
  background:radial-gradient(circle at 50% 100%,rgba(255,214,68,.28),transparent 70%);
}
.brand-bar{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand-logo{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--display);font-weight:800;font-style:italic;
  font-size:24px;letter-spacing:.03em;text-shadow:0 4px 18px rgba(0,0,0,.45);
}
.brand-sub{
  font-style:normal;font-family:'Manrope',sans-serif;font-size:9.5px;
  font-weight:800;letter-spacing:.18em;color:#f3eaff;display:block;margin-top:-2px;
}
.brand-pill{
  background:rgba(16,10,38,.55);border:1.5px solid rgba(255,214,68,.65);
  color:var(--yellow);border-radius:999px;padding:6px 12px;
  font-size:11px;font-weight:800;letter-spacing:.08em;white-space:nowrap;
}

.car{position:relative;z-index:2;margin-top:12px}
.car-track{
  display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.car-track::-webkit-scrollbar{display:none}
.slide{
  position:relative;flex:0 0 100%;height:300px;border-radius:26px;
  overflow:hidden;scroll-snap-align:center;
  background:linear-gradient(180deg,#250d5e 0%,#a71f79 52%,#ff8438 100%);
  border:1.5px solid rgba(255,255,255,.16);
  box-shadow:0 14px 32px rgba(0,0,0,.42);
}
.slide-img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;
}
.slide-art{position:absolute;inset:0;pointer-events:none}
.slide-art svg{width:100%;height:100%;display:block}
.slide-tag{
  position:relative;z-index:2;display:inline-block;margin:14px 0 0 14px;
  background:rgba(10,7,25,.68);border:1px solid rgba(255,255,255,.16);
  border-radius:999px;padding:6px 12px;
  font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--yellow);
}
.slide-body{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:52px 16px 16px;
  background:linear-gradient(0deg,rgba(9,6,23,.94) 15%,rgba(9,6,23,.35) 68%,rgba(9,6,23,0) 100%);
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
}
.slide-body h2{
  font-family:var(--display);font-weight:800;font-size:21px;line-height:1.14;
  text-shadow:0 3px 14px rgba(0,0,0,.6);
}
.slide-body h2 .hl{color:var(--yellow)}
.slide-body p{
  margin-top:5px;font-size:13px;font-weight:600;color:#e9e5ff;line-height:1.3;
}
.slide-body small{
  display:inline-block;margin-top:6px;font-family:var(--display);
  font-size:16px;font-weight:800;color:var(--yellow);
}
.slide-go{
  flex:none;background:var(--yellow);color:#090617;
  font-weight:800;font-size:13px;padding:12px 16px;border-radius:16px;white-space:nowrap;
  box-shadow:0 6px 18px rgba(255,214,68,.32);
}
.dots{display:flex;justify-content:center;gap:6px;margin-top:11px}
.dot{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.28);transition:all .25s}
.dot.on{width:24px;background:var(--yellow)}

.psplus-banner{
  margin:12px 16px 0;
  width:calc(100% - 32px);
  background:linear-gradient(125deg,#132357 0%,#14102d 62%,#2d1254 100%);
  border:1.5px solid #2b3f7d;
  border-radius:22px;
  padding:15px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 10px 24px rgba(0,0,0,.35);
}
.psplus-badge{
  display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;
  color:var(--cyan);margin-bottom:3px;
}
.psplus-banner b{
  display:block;font-family:var(--display);font-weight:800;font-size:16.5px;
}
.psplus-banner small{
  display:block;margin-top:4px;font-size:12.5px;font-weight:600;color:#b8b3d9;
}
.psplus-pill{
  background:var(--yellow);color:#090617;font-weight:800;font-size:12.5px;
  padding:10px 14px;border-radius:14px;white-space:nowrap;flex:none;
}

.sec-h{
  font-family:var(--display);font-weight:800;font-size:18px;
  margin:22px 16px 12px;
}
.tiles{
  padding:0 16px;
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.tile{
  position:relative;aspect-ratio:1/1;border-radius:22px;overflow:hidden;
  background:linear-gradient(160deg,var(--a),var(--b));
  border:1.5px solid rgba(255,255,255,.14);
  padding:14px;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 10px 22px rgba(0,0,0,.35);
}
.tile-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:2}
.tile-ico{
  width:44px;height:44px;border-radius:14px;
  background:rgba(9,6,23,.48);border:1px solid rgba(255,255,255,.14);
  display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:16px;color:#fff;
}
.tile-arr{
  width:28px;height:28px;border-radius:50%;
  background:rgba(9,6,23,.5);display:grid;place-items:center;font-size:18px;
}
.tile-foot{
  position:relative;z-index:2;
  background:rgba(9,6,23,.78);border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:10px 12px;
}
.tile-foot b{display:block;font-size:14.5px;font-weight:800}
.tile-foot small{display:block;margin-top:2px;font-size:12px;font-weight:800;color:var(--yellow)}

.sub-hero{
  position:relative;
  background:linear-gradient(180deg,#230b59 0%,#9e1d77 52%,#140e2e 100%);
  padding:16px 16px 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
  overflow:hidden;
}
.sub-hero-img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:.34;pointer-events:none;
}
.sub-top{position:relative;z-index:2;display:flex;align-items:center;gap:10px}
.back{
  width:36px;height:36px;border-radius:50%;
  background:rgba(9,6,23,.65);border:1px solid rgba(255,255,255,.16);
  font-size:22px;line-height:34px;text-align:center;flex:none;
}
.sub-tag{
  font-size:11.5px;font-weight:800;color:var(--yellow);letter-spacing:.07em;
  background:rgba(9,6,23,.58);padding:5px 11px;border-radius:999px;
}
.sub-hero h1{
  position:relative;z-index:2;
  margin-top:14px;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.15;
  text-shadow:0 3px 14px rgba(0,0,0,.55);
}
.tabs-row{display:flex;gap:8px;padding:14px 16px 0}
.chip-btn{
  padding:9px 16px;border-radius:999px;background:var(--card);
  color:var(--muted);font-weight:800;font-size:13px;border:1.5px solid var(--line);
}
.chip-btn.on{
  background:var(--card2);color:var(--yellow);border-color:var(--yellow);
}

.page{padding:14px 16px 0;display:grid;gap:12px}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:16px 18px;display:grid;gap:10px;
}
.tier-card{
  background:linear-gradient(150deg,var(--card2),var(--card));
  border:1.5px solid var(--line);
  border-radius:22px;padding:16px 16px 16px 20px;
  box-shadow:inset 6px 0 0 var(--c);display:grid;gap:12px;
}
.tier-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tier-name{font-family:var(--display);font-weight:800;font-size:20px;color:var(--c)}
.tier-short{font-size:13px;font-weight:600;color:var(--muted);margin-top:3px}
.periods-grid{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px}
.per-btn{
  background:var(--bg);border:2px solid var(--line);border-radius:14px;
  padding:10px 8px;display:flex;flex-direction:column;gap:4px;min-width:0;
}
.per-btn.sel{border-color:var(--yellow);background:rgba(255,214,68,.08)}
.per-btn span{font-size:11.5px;font-weight:700;color:var(--muted)}
.per-btn b{font-family:var(--display);font-size:13.5px;font-weight:800;white-space:nowrap;color:#fff}

.games-grid{padding:14px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gw{position:relative}
.gcard{
  width:100%;aspect-ratio:3/4;border-radius:20px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,var(--b),var(--a));display:block;
  border:1.5px solid rgba(255,255,255,.14);box-shadow:0 10px 22px rgba(0,0,0,.35);
}
.gcard img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
}
.gtxt{
  position:absolute;left:0;right:0;bottom:0;padding:38px 12px 12px;
  background:linear-gradient(0deg,rgba(9,6,23,.96) 18%,rgba(9,6,23,0) 100%);
}
.gtitle{font-family:var(--display);font-weight:800;font-size:14.5px;line-height:1.15}
.gprice{margin-top:5px;font-size:14px;font-weight:800;color:var(--yellow)}
.fav{
  position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;
  background:rgba(9,6,23,.65);border:1px solid rgba(255,255,255,.18);
  display:grid;place-items:center;z-index:2;
}
.fav svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2}
.fav.on svg{fill:var(--pink);stroke:var(--pink)}

.promo-card{
  margin:14px 16px 0;
  position:relative;overflow:hidden;border-radius:20px;
  background:linear-gradient(110deg,#3b0d6e 0%,#c7247a 55%,#ff8438 100%);
  border:1.5px solid rgba(255,214,68,.35);
  padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.promo-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38}
.promo-card > div{position:relative;z-index:2}
.promo-card b{display:block;font-family:var(--display);font-size:15px}
.promo-card span{display:inline-block;margin-top:4px;font-family:var(--display);font-size:20px;color:var(--yellow)}

.feat-list{list-style:none;display:grid;gap:9px;font-size:14px;font-weight:600;color:#ebe8ff}
.feat-list li{display:flex;gap:8px;align-items:flex-start}
.feat-list li::before{content:"✓";color:var(--yellow);font-weight:800}

.wamt{position:relative;width:100%}
.wamt input{
  width:100%;background:var(--bg);border:2px solid var(--line);border-radius:16px;
  padding:15px 44px 15px 16px;color:#fff;font:800 24px var(--display);outline:none;
}
.wamt input:focus{border-color:var(--yellow)}
.wamt input.bad{border-color:#ff5a6e}
.wamt i{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  font:800 20px var(--display);font-style:normal;color:var(--muted);
}
.wpre{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wp{
  background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:11px 6px;
  font-weight:800;font-size:13px;text-align:center;color:#fff;
}
.wp.on{background:var(--yellow);color:#090617;border-color:var(--yellow)}
.chk{
  display:flex;gap:12px;align-items:center;width:100%;
  background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:15px 16px;
  font-weight:700;font-size:14.5px;line-height:1.35;
}
.box{
  width:24px;height:24px;border-radius:8px;border:2px solid #60578c;flex:none;
  display:grid;place-items:center;
}
.chk.on{border-color:rgba(255,214,68,.5)}
.chk.on .box{background:var(--yellow);border-color:var(--yellow);color:#090617;font-weight:800}

.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;color:var(--muted)}
.row span:last-child{color:#fff;white-space:nowrap}
.total-row{
  display:flex;justify-content:space-between;align-items:baseline;
  border-top:1px solid var(--line);padding-top:11px;margin-top:2px;font-weight:800;
}
.total-row b{font-family:var(--display);font-size:19px;color:var(--yellow)}

.field{display:grid;gap:7px;font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field textarea{
  width:100%;background:var(--bg);color:#fff;border:2px solid var(--line);
  border-radius:14px;padding:13px;font:inherit;font-size:15px;font-weight:600;outline:none;resize:none;
}
.field input:focus,.field textarea:focus{border-color:var(--yellow)}
.field input.bad{border-color:#ff5a6e}
.tiny{font-size:12px;color:var(--muted);line-height:1.4}

.cta{
  width:100%;border-radius:18px;padding:15px 18px;
  background:var(--yellow);color:#090617;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 8px 22px rgba(255,214,68,.25);
}
.cta b{display:block;font-family:var(--display);font-weight:800;font-size:15.5px}
.cta small{display:block;margin-top:4px;font-size:12px;font-weight:800;opacity:.78}
.cta .go{font-weight:800;font-size:14.5px;white-space:nowrap}
.cta:active,.tile:active,.psplus-banner:active,.wp:active,.chk:active{transform:scale(.985)}

.line{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:14px 16px 14px 18px;
  box-shadow:inset 5px 0 0 var(--c,var(--yellow));display:grid;gap:10px;
}
.line-top{display:flex;justify-content:space-between;gap:10px}
.line-name{font-family:var(--display);font-weight:800;font-size:16px;color:var(--c,var(--yellow))}
.line-sub{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:3px}
.line-price{font-family:var(--display);font-weight:800;font-size:14.5px;white-space:nowrap}
.line-bot{display:flex;justify-content:space-between;align-items:center}
.qty{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:12px;padding:3px}
.qty button{width:32px;height:32px;border-radius:9px;background:var(--card2);font-size:18px;font-weight:800;text-align:center}
.qty span{min-width:26px;text-align:center;font-weight:800}
.rm{font-size:13px;color:var(--muted);font-weight:700;padding:6px}
.link{display:block;margin:2px auto 0;color:var(--muted);font-size:13px;font-weight:700;padding:8px;text-align:center}

.me{
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,#2d1259 0%,var(--card) 100%);
  border:1px solid var(--line);border-radius:22px;padding:16px;
}
.avatar{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--yellow),var(--pink));
  color:#090617;
  display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;flex:none;
}
.menu-btn{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14.5px;
}
.sec{font-weight:800;font-size:13.5px;color:var(--muted);margin-top:4px}
.ord{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:6px;font-size:13.5px;font-weight:600}
.ord-h{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:700}
.ord-t{font-weight:800;color:var(--yellow)}
.rev{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:6px}
.rev b{font-size:14px}
.rev small{color:var(--muted);font-size:12px;font-weight:700}
.rev p{font-size:13.5px;line-height:1.4;font-weight:600}

.empty{padding:42px 20px;text-align:center;color:var(--muted);font-weight:600;line-height:1.45}
.empty b{display:block;color:#fff;font-family:var(--display);font-size:17px;margin-bottom:8px}
.btn{
  display:inline-block;margin-top:16px;background:var(--yellow);color:#090617;
  border-radius:15px;padding:13px 20px;font-weight:800;font-size:14.5px;
}

.tabbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(12,8,28,.96);border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30;
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:11px;font-weight:700;color:var(--muted);position:relative;padding:4px 0;
}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--yellow)}
.cnt{
  position:absolute;top:-2px;left:calc(50% + 6px);min-width:18px;height:18px;
  border-radius:9px;padding:0 5px;background:var(--pink);color:#fff;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
}
.cnt[hidden]{display:none}

#toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);opacity:0;
  background:#221947;border:1px solid var(--line);color:#fff;padding:11px 16px;border-radius:14px;
  font-size:13.5px;font-weight:700;max-width:88%;text-align:center;
  transition:.22s;pointer-events:none;z-index:40;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.err{padding:56px 24px;text-align:center;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<nav class="tabbar" id="tabs" aria-label="Навигация">
  <button class="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg>Главная</button>
  <button class="tab" data-tab="fav"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></svg>Избранное</button>
  <button class="tab" data-tab="cart"><svg viewBox="0 0 24 24"><path d="M3 4h2.6l2.2 11h10.4l2-8H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>Корзина<b class="cnt" id="cartCnt" hidden>0</b></button>
  <button class="tab" data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c.8-4 3.7-5.8 7.5-5.8s6.7 1.8 7.5 5.8"/></svg>Профиль</button>
</nav>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const app = document.getElementById('app');
  const EMAIL_RE = /^[^@\s]{1,64}@[^@\s]{1,190}\.[^@\s]{2,20}$/;
  const MAX_LINES = 6, MAX_QTY = 9;

  const state = {
    view: 'home',
    tab: 'home',
    ret: 'home',
    car: 0,
    catTab: 'games',
    gameId: null,
    selectedPeriod: {},
    ck: { psAcc: false, email: '', comment: '' },

  let catalog = null;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  const cur = () => (catalog && catalog.currency) || '₽';
  const money = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ' + cur();
  const uahFmt = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₴';
  const psAccFee = () => (catalog && catalog.ps_account_fee != null ? Number(catalog.ps_account_fee) : 150);

  const wCfg = () => {
    const w = (catalog && catalog.wallet) || {};
    return {
      rate: w.rate != null ? Number(w.rate) : (catalog && catalog.uah_rate != null ? Number(catalog.uah_rate) : 5),
      min: w.min != null ? Number(w.min) : (catalog && catalog.uah_min != null ? Number(catalog.uah_min) : 200),
      max: w.max != null ? Number(w.max) : (catalog && catalog.uah_max != null ? Number(catalog.uah_max) : 50000),
      presets: (catalog && catalog.uah_presets) || [200, 500, 1000, 2000, 4000, 10000]

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');

  function canSend() {

    return kb && !!tg && typeof tg.sendData === 'function';

  function artSvg(kind, c1 = '#ff4fa3', c2 = '#230b59') {

    return `<svg viewBox="0 0 360 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="lumoSunset" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#220958"/>

          <stop offset="1" stop-color="#ff8038"/>

      </defs>
      <rect width="360" height="240" fill="url(#lumoSunset)"/>
      <circle cx="242" cy="116" r="54" fill="#ffd644" opacity=".9"/>

        <rect x="233" y="146" width="20" height="94"/><rect x="259" y="122" width="24" height="118"/>
        <rect x="290" y="140" width="30" height="100"/>
      </g>
      <g stroke="#0c0621" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M42 220 C44 150 40 105 32 68"/>
        <path d="M32 68 Q12 64 4 82 M32 68 Q16 52 8 44 M32 68 Q46 50 62 46 M32 68 Q52 66 64 84"/>
        <path d="M324 220 C322 156 326 112 334 76"/>
        <path d="M334 76 Q314 72 306 88 M334 76 Q318 60 310 52 M334 76 Q348 58 358 56 M334 76 Q348 76 358 90"/>
      </g>
    </svg>`;
  }

  function visualMedia(imgPath, kind, c1, c2, cls = '') {
    if (!imgPath) {
      return `<div class="${cls || 'slide-art'}">${artSvg(kind, c1, c2)}</div>`;
    }
    const safeSrc = esc(imgPath);
    const fallbackKind = esc(kind || 'sunset');
    const fc1 = esc(c1 || '#ff4fa3');
    const fc2 = esc(c2 || '#230b59');
    return `<img src="${safeSrc}" alt="" loading="lazy" class="slide-img" onerror="this.outerHTML='<div class=\'slide-art\'>' + (function(){ if('${fallbackKind}'==='pitch') return '<svg viewBox=\'0 0 360 240\' preserveAspectRatio=\'xMidYMid slice\'><rect width=\'360\' height=\'240\' fill=\'#0c291d\'/><circle cx=\'250\' cy=\'72\' r=\'54\' fill=\'${fc1}\' opacity=\'.28\'/></svg>'; return '<svg viewBox=\'0 0 360 240\' preserveAspectRatio=\'xMidYMid slice\'><defs><linearGradient id=\'fbG\' x1=\'0\' y1=\'0\' x2=\'0\' y2=\'1\'><stop offset=\'0\' stop-color=\'${fc2}\'/><stop offset=\'1\' stop-color=\'${fc1}\'/></linearGradient></defs><rect width=\'360\' height=\'240\' fill=\'url(#fbG)\'/></svg>'; })() + '</div>'">`;
  }

  const tierOf = id => (catalog.tiers || []).find(t => t.id === id);
  const gameOf = id => (catalog.games || []).find(g => g.id === id);
  const itemOf = id => tierOf(id) || gameOf(id);
  const periodOf = id => (catalog.periods || []).find(p => p.id === id);

  function tierPeriods(t) {
    return (catalog.periods || []).filter(p => t.prices && t.prices[p.id] != null);
  }

  function defaultPeriodId(t) {
    const ps = tierPeriods(t);
    return ps.length ? ps[ps.length - 1].id : null;
  }

  function priceOf(line) {
    const g = gameOf(line.t);
    if (g) return line.p === 'g' ? Number(g.price) : null;
    const t = tierOf(line.t);
    return t && t.prices && t.prices[line.p] != null ? Number(t.prices[line.p]) : null;
  }

  function lineTitle(line) { return itemOf(line.t).title; }
  function linePeriodLabel(line) {
    if (gameOf(line.t)) return 'Игра';

  function cartCount() { return cart.reduce((s, i) => s + i.q, 0); }

  function saveFavs() { store.set('lumo_fav', favs); }

  function addToCart(id, periodId) {
    const g = gameOf(id);
    const pid = g ? 'g' : periodId;
    if (!pid || priceOf({ t: id, p: pid }) == null) return;
    const existing = cart.find(i => i.t === id && i.p === pid);
    if (existing) {
      if (existing.q >= MAX_QTY) return toast('Максимум ' + MAX_QTY + ' шт. одной позиции');
      existing.q += 1;
    } else {
      if (cart.length >= MAX_LINES) return toast('Максимум ' + MAX_LINES + ' позиций в корзине');
      cart.push({ t: id, p: pid, q: 1 });
    }
    saveCart();
    toast(itemOf(id).title + ' добавлено в корзину');
    render();
  }

  function updateTabs() {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
    const badge = document.getElementById('cartCnt');

    badge.textContent = n;
    badge.hidden = !n;

  let carTimer = null, carPauseUntil = 0;
  function stopCarousel() { if (carTimer) { clearInterval(carTimer); carTimer = null; } }
  function startCarousel() {
    const track = document.getElementById('carTrack');
    if (!track) return;
    const slides = [...track.children];
    const dots = [...document.querySelectorAll('#carDots .dot')];
    if (!slides.length) return;
    const setIdx = idx => {
      state.car = idx;
      dots.forEach((d, k) => d.classList.toggle('on', k === idx));
    };
    const nearest = () => {
      const mid = track.scrollLeft + track.clientWidth / 2;
      let best = 0, dist = Infinity;
      slides.forEach((s, i) => {
        const d = Math.abs(s.offsetLeft + s.offsetWidth / 2 - mid);
        if (d < dist) { dist = d; best = i; }
      });
      return best;
    };
    track.scrollLeft = (slides[state.car] || slides[0]).offsetLeft;
    setIdx(nearest());
    track.addEventListener('scroll', () => setIdx(nearest()), { passive: true });
    ['touchstart', 'pointerdown', 'wheel'].forEach(ev => {
      track.addEventListener(ev, () => { carPauseUntil = Date.now() + 8000; }, { passive: true });
    });
    if (slides.length < 2) return;
    carTimer = setInterval(() => {
      if (Date.now() < carPauseUntil || document.hidden) return;
      const next = (nearest() + 1) % slides.length;
      track.scrollTo({ left: slides[next].offsetLeft, behavior: 'smooth' });
    }, 4500);
  }

      <h2 class="sec-h">Разделы</h2>

        <button class="tile" data-view="catalog" data-cattab="games" style="--a:#3e8be0;--b:#122d69">
          <div class="tile-top"><span class="tile-ico">🎮</span><span class="tile-arr">›</span></div>

  }

  function updateWalletDom() {
    const box = document.getElementById('wSum');
    if (box) box.innerHTML = walletSummaryHtml();
    const a = wAmount();
    document.querySelectorAll('[data-wpre]').forEach(b => b.classList.toggle('on', Number(b.dataset.wpre) === a));
    const sub = document.getElementById('wCtaSub');
    if (sub) sub.textContent = wValid() ? 'К оплате ' + money(wTotal()) : 'Укажите сумму от ' + uahFmt(wCfg().min);
  }

  function renderWallet() {
    const c = wCfg(), w = state.w, send = canSend();
    const wImg = (catalog.assets && catalog.assets.wallet) || 'assets/wallet_banner.png';
    const presets = c.presets.map(v => `<button class="wp ${v === wAmount() ? 'on' : ''}" data-wpre="${v}">${uahFmt(v)}</button>`).join('');
    const accountBlock = w.psAcc
      ? `<p class="tiny">Создадим новый аккаунт PS и передадим данные в чате с ботом.</p>`
      : (send
        ? `<div class="card">
            <label class="field">Email аккаунта PlayStation *
              <input id="wEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" value="${esc(w.email)}">
            </label>
            <p class="tiny">Пароль вводить не нужно.</p>
          </div>`
        : `<p class="tiny">Email аккаунта менеджер уточнит в чате после отправки заявки.</p>`);
    const commentBlock = send
      ? `<div class="card">
          <label class="field">Комментарий · необязательно
            <textarea id="wComment" rows="2" maxlength="300">${esc(w.comment)}</textarea>
          </label>
        </div>`
      : '';

    app.innerHTML = subHeader('БЫСТРО · УДОБНО · БЕЗ КОМИССИИ', 'Пополнение кошелька', wImg)
      + `<main class="page">
          <div class="card">
            <b>Сумма в гривнах</b>
            <div class="wamt"><input id="wAmount" type="text" inputmode="numeric" value="${wAmount() || ''}"><i>₴</i></div>
            <div class="wpre">${presets}</div>
            <p class="tiny">Курс: 1 ₴ = ${esc(c.rate)} ${esc(cur())} · от ${uahFmt(c.min)}</p>
          </div>

          <button class="chk ${w.psAcc ? 'on' : ''}" data-wua>
            <span class="box">${w.psAcc ? '✓' : ''}</span>
            <span>Создать аккаунт PS (+${money(psAccFee())})</span>
          </button>

          ${accountBlock}
          ${commentBlock}

          <div class="card" id="wSum">${walletSummaryHtml()}</div>

          <button class="cta" data-wsend>
            <div><b>Отправить заявку</b><small id="wCtaSub"></small></div>
            <span class="go">Отправить →</span>
          </button>
        </main>`;
    updateWalletDom();
  }

  function submitWallet() {
    const w = state.w, send = canSend(), email = w.email.trim();
    if (!wValid()) {
      const el = document.getElementById('wAmount');
      if (el) { el.classList.add('bad'); el.focus(); }
      return toast('Сумма пополнения: от ' + uahFmt(wCfg().min) + ' до ' + uahFmt(wCfg().max));
    }
    if (send && !w.psAcc && !EMAIL_RE.test(email)) {
      const el = document.getElementById('wEmail');
      if (el) { el.classList.add('bad'); el.focus(); }
      return toast('Укажите корректный email аккаунта');
    }
    const amount = wAmount(), total = wTotal();
    const d = new Date(), z = n => String(n).padStart(2, '0');
    const items = [{ title: 'Пополнение кошелька · ' + uahFmt(amount), period: '', q: 1 }];
    if (w.psAcc) items.push({ title: 'Создать аккаунт PS', period: '', q: 1 });
    orders.unshift({
      date: z(d.getDate()) + '.' + z(d.getMonth() + 1) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()),
      items,
      total
    });
    orders = orders.slice(0, 15);
    store.set('lumo_orders', orders);
    if (email) store.set('lumo_email', email);

    const payload = {
      wallet: {
        uah: amount,
        ps_account: w.psAcc,
        email: w.psAcc ? '' : email,
        comment: w.comment.trim().slice(0, 300)
      }
    };
    const url = 'https://t.me/' + (catalog.bot || 'psstore_Arsenyaga_bot') + '?start=w_' + amount + (w.psAcc ? '_u' : '');
    w.psAcc = false;
    w.comment = '';

    if (send) {
      tg.sendData(JSON.stringify(payload));
      return;
    }
    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink(url);
      setTimeout(() => { try { tg.close(); } catch (e) {} }, 300);
    } else {
      window.open(url, '_blank');
    }
    go('profile');
  }

  function renderCart() {
    if (!cart.length) {
      app.innerHTML = subHeader('КОРЗИНА', 'Корзина')
        + `<div class="empty"><b>Корзина пуста</b>Добавьте игры или подписки из каталога.<br><button class="btn" data-tab="home">На главную</button></div>`;
      return;
    }
    const lines = cart.map((i, idx) => {
      const item = itemOf(i.t);
      return `<div class="line" style="--c:${esc(item.color || 'var(--yellow)')}">
        <div class="line-top">
          <div>
            <div class="line-name">${esc(item.title)}</div>
            <div class="line-sub">${esc(linePeriodLabel(i))} · ${money(priceOf(i))}</div>
          </div>
          <div class="line-price">${money(priceOf(i) * i.q)}</div>
        </div>
        <div class="line-bot">
          <div class="qty">
            <button data-dec="${idx}">−</button>
            <span>${i.q}</span>
            <button data-inc="${idx}">+</button>
          </div>
          <button class="rm" data-rm="${idx}">Удалить</button>
        </div>
      </div>`;
    }).join('');

    app.innerHTML = subHeader('КОРЗИНА', 'Корзина')
      + `<main class="page">
          ${lines}
          <div class="card">
            <div class="row"><span>Позиций</span><span>${cart.length}</span></div>
            <div class="row"><span>Товаров всего</span><span>${cartCount()}</span></div>
            <div class="total-row"><span>Итого</span><b>${money(cartTotal())}</b></div>
          </div>
          <button class="cta" data-view="checkout">
            <div><b>Оформить заказ</b><small>К оплате ${money(cartTotal())}</small></div>
            <span class="go">Далее →</span>
          </button>
          <button class="link" data-clear>Очистить корзину</button>
        </main>`;
  }

  function ckTotal() {
    return cartTotal() + (state.ck.psAcc ? psAccFee() : 0);
  }

  function renderCheckout() {
    if (!cart.length) { state.view = 'cart'; return renderCart(); }
    const ck = state.ck, send = canSend();
    const rows = cart.map(i => `<div class="row"><span>${esc(lineTitle(i))} · ${esc(linePeriodLabel(i))}${i.q > 1 ? ' × ' + i.q : ''}</span><span>${money(priceOf(i) * i.q)}</span></div>`).join('');
    const feeRow = ck.psAcc ? `<div class="row"><span>Создание аккаунта PS</span><span>${money(psAccFee())}</span></div>` : '';
    const account = ck.psAcc
      ? `<p class="tiny">Создадим новый аккаунт PS и передадим данные в чате с ботом.</p>`
      : (send
        ? `<div class="card">
            <label class="field">Email аккаунта PlayStation *
              <input id="ckEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" value="${esc(ck.email)}">
            </label>
            <p class="tiny">Пароль вводить не нужно.</p>
          </div>`
        : `<p class="tiny">Email аккаунта менеджер уточнит в чате после отправки заявки.</p>`);
    const comment = send
      ? `<div class="card">
          <label class="field">Комментарий · необязательно
            <textarea id="ckComment" rows="2" maxlength="300">${esc(ck.comment)}</textarea>
          </label>
        </div>`
      : '';

    app.innerHTML = subHeader('ОФОРМЛЕНИЕ', 'Оформление заявки')
      + `<main class="page">
          <div class="card">
            <b>Состав заказа</b>
            ${rows}
            ${feeRow}
            <div class="total-row"><span>Итого</span><b>${money(ckTotal())}</b></div>
          </div>

          <button class="chk ${ck.psAcc ? 'on' : ''}" data-ua>
            <span class="box">${ck.psAcc ? '✓' : ''}</span>
            <span>Создать аккаунт PS (+${money(psAccFee())})</span>
          </button>

          ${account}
          ${comment}

          <button class="cta" data-send>
            <div><b>Отправить заявку</b><small>К оплате ${money(ckTotal())}</small></div>
            <span class="go">Отправить →</span>
          </button>
        </main>`;
  }

  function submitOrder() {
    if (!cart.length) return;
    const ck = state.ck, send = canSend(), email = ck.email.trim();
    if (send && !ck.psAcc && !EMAIL_RE.test(email)) {
      const el = document.getElementById('ckEmail');
      if (el) { el.classList.add('bad'); el.focus(); }
      return toast('Укажите корректный email аккаунта');
    }
    const codes = cart.map(i => i.t.slice(0, 2) + '-' + i.p + '-' + i.q);
    let url = null;
    if (!send) {
      url = 'https://t.me/' + (catalog.bot || 'psstore_Arsenyaga_bot') + '?start=c_' + codes.join('_') + (ck.psAcc ? '_u' : '');
      if (url.split('start=')[1].length > 64) return toast('Слишком много позиций. Оформите часть заказа отдельно');
    }

    const d = new Date(), z = n => String(n).padStart(2, '0');
    const items = cart.map(i => ({ title: lineTitle(i), period: gameOf(i.t) ? '' : linePeriodLabel(i), q: i.q }));
    if (ck.psAcc) items.push({ title: 'Создать аккаунт PS', period: '', q: 1 });
    orders.unshift({
      date: z(d.getDate()) + '.' + z(d.getMonth() + 1) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()),
      items,
      total: ckTotal()
    });
    orders = orders.slice(0, 15);
    store.set('lumo_orders', orders);
    if (email) store.set('lumo_email', email);

    const payload = {
      items: codes,
      ps_account: ck.psAcc,
      email: ck.psAcc ? '' : email,
      comment: ck.comment.trim().slice(0, 300)
    };
    cart = [];
    ck.psAcc = false;
    ck.comment = '';
    saveCart();

    if (send) {
      tg.sendData(JSON.stringify(payload));
      return;
    }
    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink(url);
      setTimeout(() => { try { tg.close(); } catch (e) {} }, 300);
    } else {
      window.open(url, '_blank');
    }
    go('profile');
  }

  function renderFav() {
    const gl = (catalog.games || []).filter(g => favs.includes(g.id));
    const tl = (catalog.tiers || []).filter(t => favs.includes(t.id));
    if (!gl.length && !tl.length) {
      app.innerHTML = subHeader('ИЗБРАННОЕ', 'Избранное')
        + `<div class="empty"><b>Пока пусто</b>Нажмите сердечко на карточке игры или подписки.<br><button class="btn" data-tab="home">На главную</button></div>`;
      return;
    }
    app.innerHTML = subHeader('ИЗБРАННОЕ', 'Избранное')
      + (gl.length ? `<div class="games-grid">${gl.map(gameCard).join('')}</div>` : '')
      + (tl.length ? `<main class="page">${tl.map(tierBlock).join('')}</main>` : '');
  }

  function renderProfile() {
    const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
    const name = u ? [u.first_name, u.last_name].filter(Boolean).join(' ') : 'Гость';
    const uid = u && u.id ? 'ID: ' + u.id : 'Telegram';
    const hist = orders.length
      ? orders.map(o => `<div class="ord">
          <div class="ord-h"><span>${esc(o.date)}</span><span>Заявка отправлена</span></div>
          ${o.items.map(i => `<div>${esc(i.title)}${i.period ? ' · ' + esc(i.period) : ''}${i.q > 1 ? ' × ' + i.q : ''}</div>`).join('')}
          <div class="ord-t">${money(o.total)}</div>
        </div>`).join('')
      : `<p class="tiny">История заявок пока пуста.</p>`;

    const revs = Array.isArray(catalog.reviews) ? catalog.reviews : [];
    const revBlock = revs.length
      ? `<div class="sec">Отзывы клиентов</div>` + revs.map(r => `<div class="rev">
          <b>${esc(r.name || 'Клиент')}${r.date ? ` <small>· ${esc(r.date)}</small>` : ''}</b>
          ${r.text ? `<p>${esc(r.text)}</p>` : ''}
        </div>`).join('')
      : '';

    app.innerHTML = subHeader('ПРОФИЛЬ', 'Профиль')
      + `<main class="page">
          <div class="me">
            <div class="avatar">${esc(name.charAt(0).toUpperCase())}</div>
            <div>
              <div style="font-weight:800;font-size:17px">${esc(name)}</div>
              <div class="tiny" style="margin-top:2px">${esc(uid)}</div>
            </div>
          </div>

          <button class="menu-btn" data-view="wallet"><span>Пополнение кошелька PSN</span><span style="color:var(--yellow)">›</span></button>
          <button class="menu-btn" data-view="catalog" data-cattab="games"><span>Каталог игр</span><span style="color:var(--yellow)">›</span></button>
          <button class="menu-btn" data-view="psplus"><span>Подписки PS Plus</span><span style="color:var(--yellow)">›</span></button>

          <div class="sec">История заявок</div>
          ${hist}
          ${revBlock}
        </main>`;
  }

  function render() {
    const y = window.scrollY;
    stopCarousel();
    const map = {
      home: renderHome,
      psplus: renderPsPlus,
      eaplay: renderEaPlay,
      catalog: renderCatalog,
      game: renderGameDetail,
      wallet: renderWallet,
      cart: renderCart,
      checkout: renderCheckout,
      fav: renderFav,
      profile: renderProfile
    };
    (map[state.view] || renderHome)();
    window.scrollTo(0, y);
    updateTabs();
    if (tg && tg.BackButton) {
      state.view === 'home' ? tg.BackButton.hide() : tg.BackButton.show();
    }
  }

  function go(view, opts = {}) {
    if (['home', 'fav', 'cart', 'profile'].includes(view)) {
      state.tab = view;
    } else if (['home', 'fav', 'cart', 'profile', 'catalog', 'psplus'].includes(state.view)) {
      state.ret = state.view;
    }
    state.view = view;
    if (opts.cattab) state.catTab = opts.cattab;
    if (opts.gameId) state.gameId = opts.gameId;
    app.innerHTML = '';
    render();
    window.scrollTo(0, 0);
  }

  document.getElementById('tabs').addEventListener('click', e => {
    const el = e.target.closest('[data-tab]');
    if (el) go(el.dataset.tab);
  });

  app.addEventListener('input', e => {
    if (e.target.id === 'wAmount') {
      const v = e.target.value.replace(/\D/g, '').slice(0, 7);
      if (v !== e.target.value) e.target.value = v;
      state.w.amount = v;
      e.target.classList.remove('bad');
      updateWalletDom();
    } else if (e.target.id === 'wEmail') {
      state.w.email = e.target.value;
      e.target.classList.remove('bad');
    } else if (e.target.id === 'wComment') {
      state.w.comment = e.target.value;
    } else if (e.target.id === 'ckEmail') {
      state.ck.email = e.target.value;
      e.target.classList.remove('bad');
    } else if (e.target.id === 'ckComment') {
      state.ck.comment = e.target.value;
    }
  });

  app.addEventListener('click', e => {
    const el = e.target.closest('[data-view],[data-cattab],[data-game],[data-back],[data-fav],[data-pick-tier],[data-add-tier],[data-add-game],[data-wpre],[data-wua],[data-wsend],[data-inc],[data-dec],[data-rm],[data-clear],[data-ua],[data-send],[data-tab]');
    if (!el) return;
    const d = el.dataset;
    if (d.tab) return go(d.tab);
    if (d.view) return go(d.view, { cattab: d.cattab });
    if (d.cattab && state.view === 'catalog') { state.catTab = d.cattab; return render(); }
    if (d.game) return go('game', { gameId: d.game });
    if ('back' in d) return go(state.view === 'checkout' ? 'cart' : (state.ret || 'home'));
    if (d.fav) {
      favs = favs.includes(d.fav) ? favs.filter(x => x !== d.fav) : favs.concat(d.fav);
      saveFavs();
      return render();
    }
    if (d.pickTier) {
      state.selectedPeriod[d.pickTier] = d.pickPer;
      return render();
    }
    if (d.addTier) return addToCart(d.addTier, d.addPer);
    if (d.addGame) return addToCart(d.addGame, 'g');
    if (d.wpre) {
      state.w.amount = Number(d.wpre);
      const inp = document.getElementById('wAmount');
      if (inp) inp.value = state.w.amount;
      return updateWalletDom();
    }
    if ('wua' in d) { state.w.psAcc = !state.w.psAcc; return render(); }
    if ('wsend' in d) return submitWallet();
    if (d.inc != null) { const l = cart[+d.inc]; if (l && l.q < MAX_QTY) { l.q++; saveCart(); render(); } return; }
    if (d.dec != null) { const l = cart[+d.dec]; if (l) { if (l.q > 1) l.q--; else cart.splice(+d.dec, 1); saveCart(); render(); } return; }
    if (d.rm != null) { cart.splice(+d.rm, 1); saveCart(); return render(); }
    if ('clear' in d) { cart = []; saveCart(); return render(); }
    if ('ua' in d) { state.ck.psAcc = !state.ck.psAcc; return render(); }
    if ('send' in d) return submitOrder();
  });

  async function loadAll() {
    const v = '?v=' + Date.now();
    const r = await fetch('catalog.json' + v, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const cat = await r.json();
    try {
      const gr = await fetch('games.json' + v, { cache: 'no-store' });
      if (gr.ok) {
        const g = await gr.json();
        if (g.shop_name) cat.shop_name = g.shop_name;
        if (g.ps_account_fee != null) cat.ps_account_fee = g.ps_account_fee;
        if (g.games) cat.games = g.games;
        if (g.wallet) cat.wallet = g.wallet;
        if (g.assets) cat.assets = Object.assign({}, cat.assets || {}, g.assets);
      }
    } catch (e) {}
    try {
      const rr = await fetch('reviews.json' + v, { cache: 'no-store' });
      if (rr.ok) {
        const rev = await rr.json();
        if (Array.isArray(rev)) cat.reviews = rev;
      }
    } catch (e) {}
    return cat;
  }

  (async () => {
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#1c094d');
        tg.setBackgroundColor('#090617');
        tg.BackButton.onClick(() => go(state.view === 'checkout' ? 'cart' : (state.ret || 'home')));
      } catch (e) {}
    }
    try {
      catalog = await loadAll();
      cart = store.get('lumo_cart', []).filter(i => i && priceOf(i) != null)
        .map(i => ({ t: i.t, p: i.p, q: Math.min(MAX_QTY, Math.max(1, i.q | 0)) })).slice(0, MAX_LINES);
      favs = store.get('lumo_fav', []).filter(id => itemOf(id));
      orders = store.get('lumo_orders', []);
      const savedEmail = store.get('lumo_email', '') || '';
      state.ck.email = savedEmail;
      state.w.email = savedEmail;
      render();
    } catch (e) {
      app.innerHTML = '<div class="err">Не удалось загрузить витрину LUMO.<br>Попробуйте открыть магазин ещё раз.</div>';
    }
  })();
})();
</script>
</body>
</html>
